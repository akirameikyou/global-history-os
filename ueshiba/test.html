<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>植芝盛平Focus の試験</title>
<style>body{background:#050c16;color:#eef3f8;font-family:system-ui,sans-serif;padding:16px}.ok{color:#8fd6a8}.ng{color:#ff8a8a}</style>
</head>
<body>
<h1>植芝盛平Focus の試験（データ）</h1>
<pre id="out"></pre>
<script type="module">
import { aikidoPersonFocus as PERSON, aikidoChronology as CHRONO, aikidoGlossary as GLOSSARY } from '../data/ueshiba_person.js';
import { ueshibaPlaces as PLACES } from '../data/ueshiba_places.js';
import { ueshibaWorld as WORLD } from '../data/ueshiba_world.js';
import { aikidoDojos as NETWORK, aikidoDojoFoundings as FOUND, aikidoFirstContacts as FIRST } from '../data/ueshiba_spread.js';
import { CALENDAR_URL } from '../data/ueshiba_config.js';
const out = document.getElementById('out'); let pass = 0, fail = 0;
const eq = (name, a, b) => { const ok = JSON.stringify(a) === JSON.stringify(b); ok ? pass++ : fail++;
  out.innerHTML += `<span class="${ok ? 'ok' : 'ng'}">${ok ? 'OK' : 'NG'}</span> ${name}${ok ? '' : ` → ${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`}\n`; };

eq('年表は年の順', CHRONO.every((c, i) => i === 0 || CHRONO[i - 1].year <= c.year), true);
eq('年表の場所はすべて地点にある', CHRONO.filter(c => c.eventId && !PLACES.some(p => p.id === c.eventId)).map(c => c.year), []);
eq('地点に緯度経度がある', PLACES.every(p => Number.isFinite(p.lat) && Number.isFinite(p.lng)), true);
eq('海外の点に年と緯度経度がある', [...FOUND, ...FIRST].every(d => Number.isInteger(d.year) && Number.isFinite(d.lat)), true);
eq('海外組織の国に緯度経度がある', NETWORK.every(d => Number.isFinite(d.lat) && Number.isFinite(d.lng)), true);
eq('id が重ならない', new Set([...PLACES, ...FOUND, ...FIRST, ...NETWORK].map(d => d.id)).size, PLACES.length + FOUND.length + FIRST.length + NETWORK.length);
eq('1967年の理事長は吉祥丸', /吉祥丸/.test(CHRONO.find(c => c.year === 1967).text), true);
const blob = JSON.stringify([PERSON, CHRONO, GLOSSARY, PLACES, WORLD, NETWORK, FOUND, FIRST]);
eq('他の団体・流派とその創始者の名が無い', ['養神館', '心身統一', '昭道館', '日本合気道協会', '富木', '岩間神信', '藤平', '塩田'].filter(w => blob.includes(w)), []);
eq('メールアドレス・電話が無い', [/[\w.+-]+@[\w-]+\.[\w.]+/.test(blob), /\d{2,4}-\d{3,4}-\d{4}/.test(blob)], [false, false]);
eq('カレンダーの URL は設定の1か所', typeof CALENDAR_URL, 'string');
eq('件数（年表・地点・世界・設立・初到達・国）', [CHRONO.length, PLACES.length, WORLD.length, FOUND.length, FIRST.length, NETWORK.length], [26, 8, 8, 11, 10, 85]);

out.innerHTML += `\n${pass} 件合格、${fail} 件不合格\n`;
document.title = fail ? `NG ${fail}` : `OK ${pass}`;
</script>
</body>
</html>
