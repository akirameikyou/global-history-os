<!doctype html>
<!-- ueshiba/focusShell.html: 植芝盛平Focus（History OS）。万次郎版 manjiro/focusShell.html の文法
     （全面の地球儀＋浮遊パネル＋下の年＋浮遊カード）に、以前の合氣道版（global-history-os/aikido/）の内容を載せる。
     見せたいもの：①開祖の生涯の拠点（青） ②合氣道が世界へ広がる（ティール）。出典は「出典」の1か所にまとめ、項目ごとには付けない。
     カメラは「場所を見る」を押した時だけ動く（自転もしない）。 -->
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History OS｜植芝盛平 Focus</title>
<meta name="description" content="植芝盛平の生涯と、合氣道が世界へ広がる歩みを、地球の上にたどる History OS（個人制作・合気会の公式サイトではありません）。">
<style>
  /* ↓ manjiro/focusShell.html の CSS をそのまま写した（同じ見た目の約束） */
  :root{
    --cyan:#66e0ff; --cyan-soft:#9becff;
    --amber:#E69445; --amber-soft:#f0b578;
    --art:#c79bff;
    /* UI COLOR SYSTEM v1（北斎 focusShell と同じ意味の色） */
    --c-focus:#66e0ff;   --c-focus-br:#c8f4ff;   /* 本人・航路 */
    --c-relation:#c79bff;--c-relation-br:#e0ccff;/* P-LINK 人物関係 */
    --c-world:#E69445;   --c-world-br:#f0b578;   /* WORLD EVENTS */
    --c-context:#8aa0b4;
    --c-rail:#ffd95e;                            /* 陸路（鉄道）＝ sandbox と同じ */
    --est:#e0b45f;                               /* 推測・留保の札 */
    --bg:#050c16;
    --panel:rgba(7,14,24,.62);
    --rule:rgba(255,255,255,.09);
    --ink:#eef3f8; --sub:#9db4c8; --dim:rgba(238,243,248,.42);
    --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho",serif; --mono:"SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #globeViz{position:fixed;inset:0;z-index:1}
  [hidden]{display:none!important}
  button{font-family:inherit}

  /* ── タイトル（上中央）── */
  .title{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
  .title h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.5em;text-indent:.5em}
  .title p{margin:7px 0 0;font-size:10.5px;letter-spacing:.42em;color:var(--cyan-soft)}
  .attrib{position:absolute;left:24px;top:80px;z-index:12;font-size:10px;color:var(--sub);background:rgba(6,10,16,.6);padding:2px 8px;border-radius:5px}

  /* ── 浮遊パネル共通 ── */
  .panel{position:absolute;z-index:20;border:1px solid var(--rule);background:var(--panel);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-radius:5px;overflow:auto}
  .panel::-webkit-scrollbar{width:6px} .panel::-webkit-scrollbar-thumb{background:rgba(102,224,255,.25);border-radius:3px}
  .panel::-webkit-scrollbar-track{background:transparent}
  .panel .sec{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding:14px 16px 6px}
  .panel .sec .secsub{text-transform:none;letter-spacing:.06em;margin-left:8px;font-size:9.5px;color:var(--dim)}

  /* ── 左上：WORLD EVENTS と、その下の W-LINK（縦に並べる。下の端は JS でタイムラインの上に合わせる）── */
  .left-col{position:absolute;left:24px;top:104px;width:270px;z-index:20;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 330px)}
  /* 2026-11-11 清水さん「ラベル部分は固定で内容だけ上に送れるほうがいい」：見出し（と W-LINK の分類の札）は動かさず、一覧（#worldList・#wlList）だけを送る。
     枠の高さは JS（layoutLeftCol）で決める：使える高さを World Events : W-LINK = 1 : φ に固定（docs/manjiro_monthly/LAYOUT_PROPORTION_v0.1.md） */
  .left-col>.panel{position:relative;left:auto;top:auto;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .left-col>.panel>.sec,.left-col .wlp-cats{flex:0 0 auto}
  .left-col .lc-list{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-gutter:stable} /* 送りのバーの幅を常に取っておく（出る・消えるで改行が変わらないように） */
  .lc-list::-webkit-scrollbar{width:6px} .lc-list::-webkit-scrollbar-thumb{background:rgba(102,224,255,.25);border-radius:3px}
  .lc-list::-webkit-scrollbar-track{background:transparent}
  .left-panel .sec{color:var(--amber-soft)}
  .wl-panel .sec{color:#d9c9ff}
  /* W-LINK が on の間は、枠の見出しの「W-LINK」を P-LINK と同じ系統の紫に（2026-11-11 清水さん。左下の W-LINK ボタンも on の間は紫） */
  .wl-panel .wl-name{transition:color .2s}
  .wl-panel.on .wl-name{color:var(--c-relation);font-weight:700}
  .wlp-cats{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
  .wlc{display:inline-flex;align-items:center;gap:5px;background:rgba(7,14,24,.55);border:1px solid var(--cc);color:var(--ink);border-radius:4px;padding:2px 8px;font-size:10.5px;cursor:pointer;line-height:1.5}
  .wlc::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--cc)}
  .wlc .n{font-family:var(--mono);font-size:9px;color:var(--dim)}
  .wlc.off{border-style:dashed;color:var(--dim);opacity:.6}
  .wlc.off::before{background:transparent;border:1px solid var(--cc)}
  .wlc:hover{opacity:1;border-color:rgba(238,243,248,.6)}
  .wl-sub{padding:5px 16px 3px;font-size:9.5px;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--rule)}
  .wli{padding:6px 14px 7px;border-bottom:1px solid var(--rule);border-left:2px solid var(--ic);cursor:pointer;transition:.18s}
  .wli:hover{background:rgba(255,255,255,.05)}
  .wli-row{display:flex;gap:7px;align-items:baseline}
  .wli .cat{font-size:9px;border:1px solid var(--cc);color:var(--cc);border-radius:3px;padding:0 4px;white-space:nowrap;line-height:1.45}
  .wli .y{font-family:var(--mono);font-size:10.5px;color:var(--sub);white-space:nowrap}
  .wli .d{font-size:9.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .wli .t{font-size:12px;line-height:1.5;margin-top:1px;color:rgba(238,243,248,.85)}
  .wli.now{background:rgba(255,255,255,.055)}
  .wli.now .t{color:var(--ink);font-weight:700}
  .wli.now .y,.wli.now .d{color:var(--ink)}
  .wli.sel{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px var(--ic)}
  .wl-empty{padding:8px 16px 10px;font-size:10.5px;color:var(--dim);line-height:1.5}
  /* World Events の行は一行に詰める（年・題・何年前/後。W-LINK の枠に高さを回すため。2026-11-11） */
  .ev{padding:7px 14px 7px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:.18s}
  .ev:hover{background:rgba(230,148,69,.08)} .ev.sel{background:rgba(230,148,69,.12);border-left:2px solid var(--amber)}
  .ev-row{display:flex;gap:9px;align-items:baseline}
  .ev .y{font-family:var(--mono);color:var(--amber-soft);flex:0 0 74px;font-size:11px}
  .ev .t{font-size:12.5px;line-height:1.5;min-width:0}
  .ev .d{font-size:9.5px;color:var(--dim);margin-left:auto;white-space:nowrap;flex:0 0 auto}
  .ev.now .d{color:var(--amber-soft)}

  /* ── 右：FOCUS PERSON ── */
  .right-panel{right:24px;top:104px;width:340px;max-height:calc(100% - 330px)}
  .fp-head{padding:13px 16px 8px}
  .fp-kicker{font-size:10px;letter-spacing:.34em;color:var(--cyan-soft);display:flex;align-items:center}
  .fp-fold{margin-left:auto;background:transparent;border:1px solid rgba(238,243,248,.25);border-radius:4px;color:var(--sub);font-size:9.5px;letter-spacing:.06em;padding:2px 7px;cursor:pointer}
  .fp-fold:hover{color:var(--ink);border-color:rgba(238,243,248,.55)}
  .fp-top{display:flex;gap:13px;margin-top:9px;align-items:flex-start}
  .fp-portrait{flex:0 0 35%;max-width:116px;width:35%;height:auto;border:1px solid var(--rule);border-radius:6px;background:rgba(255,255,255,.03);display:block}
  .fp-portrait.empty{aspect-ratio:3/4}
  .fp-ident{flex:1 1 auto;min-width:0}
  .fp-name{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15;margin:0 0 2px;letter-spacing:.03em}
  .fp-years{font-size:11.5px;color:var(--cyan);letter-spacing:.12em}
  .fp-cur{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule)}
  .fp-cur .lab{font-size:9px;letter-spacing:.16em;color:var(--dim)}
  .fp-cur .val{font-family:var(--serif);font-size:16px;font-weight:700;margin-top:2px;line-height:1.3;word-break:break-word}
  .fp-cur .val.click{cursor:pointer;border-bottom:1px dotted rgba(102,224,255,.45)}
  .fp-cur .kind{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.5}
  .fp-cur .note{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.5}
  .tchip{display:inline-block;font-family:var(--mono);font-size:9px;border-radius:3px;padding:0 5px;margin-left:5px;vertical-align:1px;border:1px solid currentColor}
  .tchip.anchor{color:var(--c-focus-br)} .tchip.interp{color:var(--est);border-style:dashed}
  .fp-lifehead{display:flex;align-items:baseline;gap:8px;padding-top:8px}
  .fp-lifehead span{font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:none}
  .chrono-item{padding:8px 16px;cursor:pointer;transition:.2s;border-bottom:1px solid var(--rule)}
  .chrono-item:hover{background:rgba(102,224,255,.06)} .chrono-item.sel{background:rgba(102,224,255,.10)}
  .chrono-item.near{box-shadow:inset 2px 0 0 var(--cyan-soft)}
  .chrono-item.secondary{opacity:.72}
  .chrono-year{font-family:var(--mono);font-size:12px;color:var(--cyan);font-weight:700}
  .chrono-cert{font-size:9px;color:var(--est);margin-left:5px}
  .chrono-text{font-size:12px;line-height:1.55;color:rgba(238,243,248,.85);margin-top:2px}

  /* ── 右下：P-LINK ── */
  #plinkPanel{right:24px;bottom:30px;width:340px;max-height:40vh}
  .plink>summary{padding:12px 16px;font-size:11px;letter-spacing:.16em;color:var(--cyan);cursor:pointer;list-style:none}
  .plink>summary::-webkit-details-marker{display:none}
  .pl-item{padding:8px 16px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--rule);transition:.18s}
  .pl-item:hover{background:rgba(199,155,255,.07)} .pl-item.sel{background:rgba(199,155,255,.13);border-left:2px solid var(--art)}
  .pl-item .nm{font-size:12.5px}
  .pl-item .rel{font-size:10px;color:var(--c-relation-br);margin-left:auto;white-space:nowrap}
  .pl-item .yrs{font-family:var(--mono);font-size:9.5px;color:var(--dim);flex-basis:100%}
  .pl-hint{padding:4px 16px 10px;font-size:10px;color:var(--dim);line-height:1.5}
  .pl-active{margin-left:8px;font-size:10px;color:var(--art);letter-spacing:0}
  .pl-active .x{margin-left:6px;cursor:pointer;border:1px solid rgba(199,155,255,.5);border-radius:4px;padding:0 5px;color:var(--art)}
  /* P-LINK を開いている間は、右の人物パネルを短くして重ならないようにする（PC） */
  @media (min-width:641px){ body.pl-open .right-panel{max-height:max(150px,calc(100% - 104px - 40vh - 30px - 14px))} }

  /* ── 右上：CHAPTER・航路について・追跡 ── */
  #spaceControls{position:absolute;top:24px;right:24px;z-index:35;display:flex;gap:8px;align-items:flex-start}
  .tgl{background:rgba(7,14,24,.7);border:1px solid var(--rule);color:var(--sub);border-radius:8px;padding:6px 11px;font-size:11px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
  .tgl:hover{color:var(--ink)}
  .tgl.on{color:var(--cyan);border-color:rgba(102,224,255,.5)}
  /* 左下の隅：W-LINK ボタン（2026-11-11 清水さん「W-linkボタンを左下隅に移動して」）。凡例の一行の上に置く。
     年代バーが左下まで来る幅（641〜1199px）では JS（layoutLeftCol）が年代バーの上へ上げる。スマホは右上の並びに戻す（placeWlinkBtn） */
  .wl-corner{position:absolute;left:24px;bottom:30px;z-index:30}
  #wlinkBtn.on{color:var(--c-relation-br);border-color:rgba(199,155,255,.7);background:rgba(199,155,255,.16)}
  .chap-wrap{position:relative}
  .chap-menu{position:absolute;right:0;top:calc(100% + 6px);width:260px;max-height:62vh;overflow:auto;z-index:36;
    background:rgba(10,16,26,.96);border:1px solid var(--rule);border-radius:7px;box-shadow:0 14px 36px rgba(0,0,0,.5)}
  .chap-menu::-webkit-scrollbar{width:6px} .chap-menu::-webkit-scrollbar-thumb{background:rgba(102,224,255,.25);border-radius:3px}
  .chap-item{display:flex;align-items:baseline;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
  .chap-item:hover{background:rgba(102,224,255,.07)} .chap-item.on{background:rgba(102,224,255,.13);border-left:2px solid var(--cyan)}
  .chap-item .en{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink)}
  .chap-item .ja{font-size:11px;color:var(--sub)}
  .chap-item .yr{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .chap-item .go{font-size:9.5px;color:#cbe6ff;border:1px solid rgba(124,179,255,.4);border-radius:3px;padding:0 5px;white-space:nowrap}
  .chap-item .go:hover{background:rgba(124,179,255,.18)}

  /* ── 航路について（浮遊パネル）── */
  .route-panel{left:24px;top:104px;width:min(560px,calc(100vw - 48px));max-height:calc(100vh - 340px);z-index:50;background:rgba(10,16,26,.95)}
  .route-panel .sec{color:var(--cyan-soft)}
  .route-panel .x{position:absolute;top:8px;right:9px;background:transparent;border:0;color:var(--sub);font-size:14px;cursor:pointer}
  .ri-p{padding:0 16px;margin:4px 0 10px;font-size:12px;line-height:1.75;color:rgba(238,243,248,.88)}
  .ri-p.sub{font-size:11px;color:var(--sub)}
  .ri-p a{color:#cbe6ff;text-decoration:none} .ri-p a:hover{text-decoration:underline}
  .ri-tr{border-top:1px solid var(--rule)}
  .ri-tr>summary{padding:9px 16px;cursor:pointer;list-style:none;font-size:12px}
  .ri-tr>summary::-webkit-details-marker{display:none}
  .ri-tr>summary .yr{font-family:var(--mono);font-size:10px;color:var(--sub);margin-left:6px}
  .ri-tr>summary .cnt{font-size:10px;color:var(--dim);margin-left:6px}
  .ri-body{padding:0 16px 12px}
  .ri-warn{font-size:10.5px;color:var(--est);margin:4px 0}
  .ri-conf-h{font-size:10px;letter-spacing:.12em;color:var(--est);margin:10px 0 4px;padding-top:8px;border-top:1px dashed rgba(224,180,95,.35)}
  .ri-conf{font-size:11px;line-height:1.65;color:rgba(238,243,248,.85);margin:0 0 6px;padding-left:8px;border-left:2px solid rgba(224,180,95,.5)}
  .ri-conf a{color:#cbe6ff;text-decoration:none} .ri-conf a:hover{text-decoration:underline}
  table.ri .an a{color:#cbe6ff;text-decoration:none} table.ri .an a:hover{text-decoration:underline}
  .tchip.gap{color:var(--dim);border-style:dotted}
  .ri-src{font-size:10.5px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
  .ri-src a{color:#cbe6ff;text-decoration:none} .ri-src a:hover{text-decoration:underline}
  table.ri{width:100%;border-collapse:collapse;font-size:10.5px}
  table.ri th{font-weight:400;color:var(--dim);text-align:left;padding:3px 4px;border-bottom:1px solid var(--rule);white-space:nowrap}
  table.ri td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;color:rgba(238,243,248,.85)}
  table.ri td.m{font-family:var(--mono);white-space:nowrap}
  table.ri tr{cursor:pointer} table.ri tr:hover td{background:rgba(102,224,255,.06)}
  table.ri tr.cur td{background:rgba(102,224,255,.12)}
  .ri-conf.done{opacity:.55}
  table.ri .an{color:var(--sub);line-height:1.5}

  /* ── 中央下：タイムライン ──
     画面の中央（地球の中心の下）に置く（2026-11-10 清水さん「年代バーが左よりなのは理由がありますか？」。北斎版の名残りで右だけ空けていた）。
     右下の P-LINK（right 24px・幅 340px）と 24px 空ける分（388px）を左右とも取り、残りをなるべく使う。左の列は下の端をタイムラインの上に合わせる（layoutLeftCol）ので重ならない */
  #timelineBar{position:absolute;bottom:30px;left:388px;right:388px;max-width:1100px;margin:0 auto;z-index:30;user-select:none}
  /* 狭い PC（641〜1199px）は、中央に置くと幅が足りないので、従来どおり P-LINK の左に置く */
  @media (min-width:641px) and (max-width:1199px){ #timelineBar{left:24px;right:388px;max-width:820px} }
  /* 幅 1379px までの PC は年代バーが 600px に足りないので、自動鑑賞の操作は記号だけにする（文字は title に。「章に合わせる」まで出ると見出しが年代バーからはみ出した） */
  @media (min-width:641px) and (max-width:1379px){ .auto-ctl .lbl{display:none} }
  .tl-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:8px}
  #tlYear{font-size:34px;color:var(--cyan-soft);letter-spacing:.04em;line-height:1;font-family:var(--serif);white-space:nowrap}
  #tlEra{font-size:11px;color:var(--sub);letter-spacing:.06em;padding-bottom:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-ctrl{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:4px;flex:0 0 auto}
  .zoombtn,.playbtn{background:rgba(7,14,24,.7);border:1px solid var(--rule);color:var(--ink);border-radius:6px;width:28px;height:26px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .playbtn{width:34px;color:var(--cyan);border-color:rgba(102,224,255,.45);font-size:12px}
  .playbtn.on{background:rgba(102,224,255,.18)}
  .chrono-item.near{background:rgba(102,224,255,.07)}
  .zoombtn:hover,.playbtn:hover{border-color:rgba(238,243,248,.4)}
  .tl-hint{font-size:10px;color:var(--dim);letter-spacing:.03em;margin-top:2px}
  #tl{width:100%;height:100px;display:block;cursor:ew-resize;touch-action:none;overflow:visible} /* 段の名を左の外（余白）に出す（PC で年代バーの左が空いている時） */

  /* ── 凡例（最下部一列）── */
  .legend{position:absolute;left:24px;right:24px;bottom:8px;z-index:25;display:flex;gap:22px;align-items:center;white-space:nowrap;font-size:10.5px;color:var(--dim);line-height:1.4;letter-spacing:.3px}
  .legend>div{display:flex;align-items:center;gap:6px}
  .legend svg{width:26px;height:8px;opacity:.75}
  .lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;opacity:.8}
  .lg-dot.fill{background:var(--c-focus-br)} .lg-dot.hollow{border:2px solid var(--c-focus-br)}

  /* ── 船の印（地球儀の上の HTML 要素）── */
  .ship{position:relative;width:14px;height:14px;pointer-events:auto;cursor:pointer}
  .ship .dot{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px rgba(5,12,22,.75),0 0 10px rgba(102,224,255,.55)}
  .ship.anchor .dot{background:var(--c-focus-br)}
  .ship.interp .dot{border:2.5px solid var(--c-focus-br);background:transparent}
  .ship .chip{position:absolute;left:18px;top:-1px;font-size:10px;line-height:1.3;color:var(--est);border:1px dashed var(--est);border-radius:3px;padding:0 4px;white-space:nowrap;
    background:rgba(5,12,22,.6);text-shadow:0 1px 2px #000}
  .ship.anchor .chip{display:none}
  .ship.anchor.sec .chip{display:inline-block;color:var(--c-focus-br);border-style:solid}
  .ship.bg{opacity:.35}
  .ship.rail .dot{box-shadow:0 0 0 2px rgba(5,12,22,.75),0 0 10px rgba(255,217,94,.55)}
  /* 航路から外れた記録の位置（◇）*/
  .obs{position:relative;width:14px;height:14px;pointer-events:auto;cursor:pointer}
  .wl{position:relative;width:12px;height:12px;pointer-events:auto;cursor:pointer;opacity:.75}
  .wl .ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--wc);background:rgba(5,12,22,.3)}
  .wl .wl-t{position:absolute;left:16px;top:-2px;font-size:9.5px;letter-spacing:.06em;color:var(--wc);white-space:nowrap;text-shadow:0 0 4px #050c16}
  .wl:hover{opacity:1}
  /* 選んだ W-LINK（左の一覧・年代バー・地球の印を押した時）。カメラは動かさず、印を少し明るくするだけ */
  .wl.sel{opacity:1;z-index:2}
  .wl.sel .ring{border-style:solid;border-width:2px;background:rgba(255,255,255,.14);box-shadow:0 0 0 2px rgba(5,12,22,.6),0 0 12px var(--wc)}
  .wl.sel .wl-t{font-weight:700;color:#fff;text-shadow:0 0 4px #050c16,0 0 8px var(--wc)}
  .wl.sel.off .ring{border-style:dashed}
  .obs .dia{position:absolute;left:3px;top:3px;width:8px;height:8px;transform:rotate(45deg);border:1.6px solid #ffffff;background:rgba(5,12,22,.35);box-shadow:0 0 6px rgba(255,255,255,.5)}
  .obs.bg{opacity:.35}
  .lg-dia{display:inline-block;width:8px;height:8px;transform:rotate(45deg);border:1.5px solid #fff;opacity:.75;margin:0 2px}

  /* ── 詳細カード（北斎 focusShell と同じ形。PIN は持たない）── */
  .dcard{position:fixed;left:24px;top:120px;width:min(360px,86vw);max-height:calc(100vh - 24px);overflow:auto;z-index:75;
    background:rgba(10,16,26,.96);border:1px solid var(--rule);border-left:3px solid var(--c-focus);
    border-radius:9px;box-shadow:0 18px 46px rgba(0,0,0,.5);padding:16px 18px 18px;animation:cardIn .16s ease-out}
  .dcard::-webkit-scrollbar{width:6px} .dcard::-webkit-scrollbar-thumb{background:rgba(102,224,255,.25);border-radius:3px}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .dcard .dc-head{cursor:move;user-select:none}
  .dcard .dc-x{position:absolute;top:8px;right:9px;background:transparent;border:0;color:var(--sub);font-size:14px;cursor:pointer;z-index:2}
  .dcard .dc-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;font-weight:700;padding-right:22px}
  .dcard .dc-title{font-family:var(--serif);font-size:19px;font-weight:700;margin-top:6px;line-height:1.3}
  .dcard .dc-sub{font-size:11px;color:var(--sub);margin-top:4px;letter-spacing:.04em}
  .dcard .dc-body{font-size:12.5px;line-height:1.85;color:rgba(238,243,248,.9);margin-top:12px;white-space:pre-line}
  .dcard .dc-body a{color:#cbe6ff;text-decoration:none} .dcard .dc-body a:hover{text-decoration:underline}
  .dcard .dc-rel{font-size:11px;color:var(--dim);margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);line-height:1.6;white-space:pre-line}
  /* 自動鑑賞のカード：本文の下に「確かさ」を一行だけ。残りの注記・出典は畳む（2026-11-10 注記が積み重なって読みにくかった） */
  .dcard .dc-cert{font-size:11.5px;line-height:1.6;margin-top:10px;padding:4px 9px;border-left:2px solid var(--est);color:#ffe2a8;background:rgba(224,180,95,.08);border-radius:0 3px 3px 0;white-space:normal}
  .dcard .dc-cert.rec{border-left-color:var(--cyan-soft);color:#cbeefc;background:rgba(102,224,255,.06)}
  .dcard .dc-more{margin-top:8px;white-space:normal}
  .dcard .dc-more>summary{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--sub);cursor:pointer;list-style:none;padding:3px 0}
  .dcard .dc-more>summary::-webkit-details-marker{display:none}
  .dcard .dc-more>summary:hover{color:var(--ink)}
  .dcard .dc-more p{font-size:11px;line-height:1.65;color:var(--dim);margin:4px 0 6px}
  /* 自動鑑賞のカード（2026-11-11 清水さん）：年代バーの大きな年月（tlYear）のすぐ上に、題・年月と場所・本文の最初の1文・確かさの一行だけ。
     残り（本文の続き・注記・出典・地点を見る）は「詳しく ▸」に畳む。一時停止中は「⏸ 一時停止中 — ▶ 再開」をはっきり出す */
  .dcard.auto{padding:13px 16px 12px}
  .dcard.auto .dc-tag{display:none}
  .dcard.auto .dc-title{margin-top:0;padding-right:22px;font-size:18px}
  .dcard.auto .dc-sub{font-family:var(--mono);color:var(--cyan-soft);font-size:11px}
  .dcard.auto .dc-body{margin-top:8px;line-height:1.75}
  .dcard.auto .dc-cert{margin-top:8px}
  .dcard .dc-more .dc-more-body{font-size:12px;line-height:1.75;color:rgba(238,243,248,.85);margin:4px 0 6px;white-space:pre-line}
  .dcard .dc-more .dc-act{margin-top:6px}
  .dcard.auto .dc-more>summary{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--cyan-soft);padding:4px 0 0}
  /* 表示時間の線とカードの中の小さな一時停止は外した（2026-11-11 清水さん「読む時に目障り・視線を奪う」）。止める操作は年代バーの横の一時停止だけ。
     カードの中には、一時停止中の時だけ「再開」を出す */
  .dc-play{display:flex;align-items:center;gap:8px;margin-top:9px}
  .dc-play:not(.paused){display:none}
  .dc-play button,.auto-resume{font-family:inherit;cursor:pointer;white-space:nowrap}
  /* 確かさの小さな札（自動鑑賞のカードの年月の行の横）。黄色の一行は目立ちすぎるので、文は「詳しく」に移し、ここは破線の小さな札だけ（破線＝推定、凡例と同じ） */
  .dc-sure{display:inline-block;margin-left:8px;padding:0 6px;border:1px dashed rgba(238,243,248,.3);border-radius:3px;font-family:var(--sans);font-size:10px;line-height:1.6;color:var(--sub);letter-spacing:.04em;vertical-align:1px}
  .auto-resume{display:block;width:100%;background:rgba(224,180,95,.2);border:1.5px solid var(--est);color:#ffe9bf;border-radius:6px;
    font-size:13px;font-weight:700;letter-spacing:.04em;padding:8px 12px;text-align:center;box-shadow:0 0 14px rgba(224,180,95,.25)}
  .auto-resume:hover{background:rgba(224,180,95,.32)}
  .dc-play{flex-wrap:wrap}
  .dc-play .auto-resume{flex:1 1 100%}
  /* 一時停止中で、カードも表紙も出ていない時（航路を伸ばしている途中で止めた時）の札。位置はカードと同じ（tlYear のすぐ上） */
  #autoPausePill{position:fixed;z-index:76;width:auto}
  /* .dock（表紙をカードと同じ所に出す形）は 2026-11-11 にやめ、表紙は上の中央に戻した（positionCover）。形だけ残す */
  .auto-cover.dock{transform:none;text-align:left;animation:coverInDock .6s ease-out;padding:13px 18px 13px}
  .auto-cover.dock .ac-act{justify-content:flex-start}
  @keyframes coverInDock{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .auto-cover .ac-pause{margin-top:10px;pointer-events:auto}
  .dcard .dc-act{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:#cbe6ff;
    background:rgba(124,179,255,.12);border:1px solid rgba(124,179,255,.4);border-radius:3px;padding:5px 10px;cursor:pointer}
  .dcard .dc-act:hover{background:rgba(124,179,255,.22)}
  .kv{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.6;white-space:normal}
  .kv:first-child{border-top:0}
  .kv .k{flex:0 0 72px;font-size:10px;color:var(--sub);padding-top:1px}
  .kv .v{flex:1 1 auto;min-width:0}
  .dc-sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--sub);margin:12px 0 4px;padding-top:9px;border-top:1px solid var(--rule)}
  .dc-para{white-space:normal;margin:0 0 6px}
  .pl-portrait{float:right;width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);margin:0 0 8px 10px}
  .trace{white-space:normal;font-size:11.5px;line-height:1.6;margin:0 0 7px}
  .trace .ty{font-family:var(--mono);color:var(--c-relation-br);margin-right:6px}
  .trace .go{color:#cbe6ff;border-bottom:1px dotted rgba(203,230,255,.6);cursor:pointer}
  .trace .dt{display:block;font-size:10.5px;color:var(--sub);margin-left:40px}
  .pg-box{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);white-space:normal}
  .pg-link{display:inline-block;font-size:11.5px;color:#cbe6ff;border:1px solid rgba(124,179,255,.45);border-radius:4px;padding:4px 10px;text-decoration:none}
  .pg-link:hover{background:rgba(124,179,255,.16)}
  .pg-off{display:inline-block;font-size:11px;color:var(--dim);border:1px dashed rgba(238,243,248,.2);border-radius:4px;padding:3px 9px;cursor:not-allowed}
  .pg-none{font-size:10.5px;color:var(--dim)}
  .wl-person{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:5px 0;border-top:1px solid var(--rule);font-size:12px;white-space:normal}
  .dc-sec + .wl-person{border-top:0} /* 見出し（dc-sec も div）の直後の一人目。:first-of-type では効かなかった（監査 r4 L8） */
  .wl-person .nm{font-weight:700}
  .wl-person .qid{font-family:var(--mono);font-size:10.5px;color:#cbe6ff;text-decoration:none}
  .wl-person .qid:hover{text-decoration:underline}
  .wl-person .pg-link{font-size:10.5px;padding:2px 8px}
  .wl-person .pg-off{font-size:10px;padding:1px 7px}
  /* 年譜のカードの資料（e.media：手紙・画像。将来のため。今のデータには無い）と、その拡大 */
  .dm-row{display:flex;flex-wrap:wrap;gap:8px;white-space:normal}
  .dm-item{display:flex;flex-direction:column;align-items:center;width:84px;padding:3px;background:rgba(255,255,255,.04);border:1px solid var(--rule);border-radius:5px;color:var(--sub);cursor:zoom-in}
  .dm-item:hover{border-color:rgba(124,179,255,.55)}
  .dm-item img{display:block;width:76px;height:56px;object-fit:cover;border-radius:3px;background:#0b1522}
  .dm-item.broken{cursor:default;opacity:.6}
  .dm-cap{font-size:9.5px;line-height:1.3;margin-top:3px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbox{position:fixed;inset:0;z-index:120;background:rgba(3,8,14,.88);display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox[hidden]{display:none}
  .mb-inner{position:relative;max-width:min(980px,96vw);max-height:94vh;display:flex;flex-direction:column;align-items:center}
  .mb-inner img{display:block;max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px;background:#0b1522}
  .mb-inner img[hidden]{display:none}
  .mb-cap{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--sub);text-align:center;white-space:normal}
  .mb-cap a{color:#cbe6ff}
  .mb-close{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:rgba(10,16,26,.96);border:1px solid var(--rule);color:var(--ink);cursor:pointer;font-size:13px}

  /* ── 自動鑑賞（章の表紙・操作）── */
  .autobtn{background:rgba(102,224,255,.2);border:1px solid rgba(102,224,255,.8);color:#e4f9ff;border-radius:6px;height:26px;cursor:pointer;
    font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:0 11px;white-space:nowrap;box-shadow:0 0 12px rgba(102,224,255,.28)}
  .autobtn:hover{background:rgba(102,224,255,.32)}
  .auto-ctl{display:flex;align-items:center;gap:5px}
  .auto-ctl button{background:rgba(7,14,24,.78);border:1px solid rgba(102,224,255,.45);color:var(--ink);border-radius:6px;height:26px;cursor:pointer;font-size:11px;padding:0 9px;white-space:nowrap}
  .auto-ctl button:hover{border-color:rgba(238,243,248,.6)}
  .auto-ctl button:disabled{opacity:.38;cursor:default}
  .auto-ctl button.paused{background:rgba(224,180,95,.18);border-color:var(--est);color:#ffe2a8}
  .auto-ctl .prog{font-family:var(--mono);font-size:10px;color:var(--cyan-soft);white-space:nowrap;letter-spacing:.06em}
  .tgl:disabled{opacity:.35;cursor:default}
  .auto-cover{position:fixed;left:50%;top:92px;transform:translateX(-50%);width:min(480px,86vw);z-index:70;pointer-events:none;
    background:rgba(8,14,24,.8);border:1px solid rgba(102,224,255,.26);border-top:3px solid var(--c-focus);border-radius:10px;
    box-shadow:0 18px 46px rgba(0,0,0,.45);padding:15px 22px 15px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:coverIn .6s ease-out}
  @keyframes coverIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .ac-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--cyan-soft)}
  .ac-en{font-family:var(--mono);font-size:25px;letter-spacing:.16em;font-weight:700;margin-top:6px;color:#eaf9ff}
  .ac-ja{font-family:var(--serif);font-size:17px;font-weight:700;margin-top:2px}
  .ac-yr{font-family:var(--mono);font-size:13px;color:var(--cyan);margin-top:6px;letter-spacing:.1em}
  .ac-voy{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6}
  .ac-line{font-size:12.5px;line-height:1.75;margin-top:7px;color:rgba(238,243,248,.92)}
  .ac-act{margin-top:12px;pointer-events:auto;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .ac-act button{background:rgba(124,179,255,.12);border:1px solid rgba(124,179,255,.45);color:#cbe6ff;border-radius:5px;padding:5px 12px;font-size:11.5px;cursor:pointer}
  .ac-act button:hover{background:rgba(124,179,255,.24)}
  body.auto-on .dcard{max-height:calc(100vh - 300px)}

  /* ===== スマホ（≤640px）：崩れない最低限 ===== */
  @media (max-width:1100px){ .legend{gap:12px;font-size:9.5px} }
  /* 641〜1379px：凡例が一行に収まらず画面の右へはみ出していた（ページの幅が広がる）。はみ出す分は右端で薄く消す（2026-11-12 公開前の確かめ。全部を見せる並べ方は次の課題） */
  @media (min-width:641px) and (max-width:1379px){ .legend{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)} }
  @media (max-width:640px){
    .title{left:12px;top:12px;transform:none;text-align:left}
    .title h1{font-size:15px;letter-spacing:.08em;text-indent:0}
    .title p{display:none}
    .attrib{left:12px;top:36px;font-size:8.5px;padding:1px 6px}
    .left-col,.left-panel,.wl-panel{display:none!important} /* World Events と W-LINK の枠はスマホでは出さない（W-LINK は年代バーの1段と地球の印で） */
    #spaceControls{top:8px;right:8px;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 150px)}
    .tgl{padding:7px 9px;font-size:10.5px}
    .chap-menu{width:min(280px,calc(100vw - 16px))}
    .right-panel{top:84px;right:8px;left:8px;width:auto;max-height:calc(100dvh - 84px - 330px)}
    .fp-portrait{width:72px;flex-basis:72px}
    .fp-name{font-size:18px}
    #plinkPanel{right:8px;left:8px;width:auto;bottom:240px;max-height:30vh}
    body.fp-folded #plinkPanel{display:none}
    body.fp-folded .fp-portrait{display:none}
    .route-panel{left:8px;right:8px;top:84px;width:auto;max-height:calc(100dvh - 84px - 220px)}
    #timelineBar{left:8px;right:8px;max-width:none;bottom:70px} /* 凡例（2〜3行）の上に置く */
    .tl-head{margin-bottom:3px;gap:8px}
    #tlYear{font-size:22px;text-shadow:0 1px 8px #000}
    #tlEra,.tl-hint{display:none}
    .zoombtn{width:34px;height:32px}
    .playbtn{width:40px;height:32px}
    .legend{left:8px;right:8px;bottom:4px;gap:4px 12px;flex-wrap:wrap;font-size:9px;white-space:normal}
    .legend svg{width:18px}
    .dcard{left:8px!important;width:calc(100vw - 16px);max-height:calc(100dvh - 60px)}
    /* 自動鑑賞：表紙とカードは下寄せ・小さめ（位置は JS でタイムラインの上に置く）。操作は記号だけにして一行に収める */
    .tl-head{flex-wrap:wrap}
    .autobtn{height:32px;padding:0 10px}
    .auto-ctl button{height:32px;padding:0 10px}
    .auto-ctl .lbl{display:none}
    .auto-cover{width:calc(100vw - 16px);padding:10px 14px 11px}
    .ac-en{font-size:18px;margin-top:3px} .ac-ja{font-size:14px} .ac-yr{font-size:11.5px;margin-top:3px}
    .ac-voy{font-size:10px;margin-top:4px;line-height:1.45} .ac-line{font-size:11.5px;line-height:1.6;margin-top:4px}
    body.auto-on #plinkPanel{display:none}
    body.auto-on .dcard{max-height:36dvh;padding:12px 14px 14px}
    body.auto-on .dcard .dc-title{font-size:16px}
    body.auto-on .dcard .dc-body{font-size:11.5px;line-height:1.65;margin-top:8px}
  }
  body.fp-folded .fp-body{display:none}
  /* ===== 植芝盛平Focus だけの足し（上は manjiro/focusShell.html の CSS をそのまま写した） ===== */
  /* 見せたいものは二つだけ：①開祖の生涯の移動（青） ②合氣道が世界へ広がる（ティール）。他は脇役として控えめに */
  html{scrollbar-color:rgba(102,224,255,.25) transparent}
  ::-webkit-scrollbar{width:6px;height:6px;background:transparent} ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(102,224,255,.25);border-radius:3px} ::-webkit-scrollbar-button{display:none}
  :root{ --c-spread:#57c9c0; --c-spread-br:#9ee8e1; --c-term:#b79cff; }

  /* 右：人物（肖像・一言・年表）。年表は「いまの年まで」を明るく、先は淡く */
  .fp-portrait{border-radius:50%;aspect-ratio:1/1;object-fit:cover;object-position:50% 20%;flex:0 0 84px;width:84px;max-width:84px}
  .fp-top{align-items:center}
  .fp-lead{font-size:12px;line-height:1.85;color:rgba(238,243,248,.82);margin:10px 0 0}
  .chrono-item{display:grid;grid-template-columns:50px minmax(0,1fr);gap:0 8px;padding:7px 16px}
  .chrono-item .age{font-size:9.5px;color:var(--sub);display:block;margin-top:1px;font-family:var(--sans)}
  .chrono-item .chrono-text{margin-top:0}
  .chrono-item.future{opacity:.38}
  .chrono-item.now{background:rgba(102,224,255,.10);box-shadow:inset 2px 0 0 var(--cyan)}
  .chrono-item.now .chrono-text{color:#fff}
  .term{color:var(--c-term);border-bottom:1px dotted rgba(183,156,255,.7);cursor:pointer}
  .term:hover{color:#d9cbff}

  /* 左：世界の出来事は一行ずつ（読み物は押してカードで） */
  .left-col{width:236px}
  .we{display:flex;gap:9px;align-items:baseline;padding:7px 14px 7px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:.18s}
  .we:hover{background:rgba(230,148,69,.08)}
  .we .y{font-family:var(--mono);color:var(--amber-soft);flex:0 0 40px;font-size:11px}
  .we .t{font-size:12px;line-height:1.5}
  .we.future{opacity:.38}
  .we.now{background:rgba(230,148,69,.10);box-shadow:inset 2px 0 0 var(--amber)}

  /* 右上：脇の入口は小さく */
  a.tgl{text-decoration:none;display:inline-block}
  .cal-short{display:none}

  /* 下：年の帯（1本）。目盛りは生涯（青）と海外（ティール）だけ */
  #timelineBar{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100vw - 48px - 236px - 24px - 340px - 24px));min-width:420px;max-width:none;margin:0}
  @media (min-width:641px) and (max-width:1199px){ #timelineBar{left:24px;right:388px;transform:none;width:auto;min-width:0} }
  #tlYear{font-size:40px}
  #tlEra{font-size:12px;color:var(--sub)}

  /* カード */

<script type="module">
import Globe from 'https://esm.sh/globe.gl@2.46.2?deps=three-globe@2.45.2'; // 万次郎版と同じ固定版
import { aikidoPersonFocus as PERSON, aikidoChronology as CHRONO, aikidoGlossary as GLOSSARY } from '../data/ueshiba_person.js?v=20261114b';
import { ueshibaPlaces as PLACES } from '../data/ueshiba_places.js?v=20261114b';
import { ueshibaWorld as WORLD } from '../data/ueshiba_world.js?v=20261114b';
import { aikidoDojos as NETWORK, aikidoDojoFoundings as FOUND, aikidoFirstContacts as FIRST } from '../data/ueshiba_spread.js?v=20261114b';
import { CALENDAR_URL } from '../data/ueshiba_config.js?v=20261114b';

// 原則：年を送ってもカメラは動かさない。カメラが動くのは「場所を見る」を押した時だけ（自転もしない）。
// 見せる順：①生涯の拠点が年とともに増える ②1950年代から海外への広がりが灯る ③今の年で合気会の海外組織の国が並ぶ。
const RANGE = { min: 1880, max: new Date().getFullYear() };
const PLAY_MS = 450;
const COL = { life: '#66e0ff', lifeBr: '#c8f4ff', spread: '#57c9c0', spreadBr: '#9ee8e1', first: 'rgba(87,201,192,.55)', net: 'rgba(238,243,248,.45)' };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mk(tag, cls, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
const placeById = id => PLACES.find(p => p.id === id) || null;

// 章（年代バーの見出し。生涯の地名で区切る）
const ERAS = [[1883, '田辺'], [1912, '北海道'], [1919, '綾部'], [1927, '東京'], [1942, '岩間'], [1948, '合気会・本部道場'], [1969, '開祖ののち・世界へ']];
const eraOf = y => { let n = ''; ERAS.forEach(([a, s]) => { if (y >= a) n = s; }); return y < 1883 ? '' : n; };

// 用語（以前の合氣道版と同じ：パネルの中で初めて出た語だけを色分けし、押すと語釈）
const TERMS = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
const TERM_RE = TERMS.length ? new RegExp('(' + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g') : null;
function linkify(text, seen) {
  const t = esc(text); if (!TERM_RE) return t;
  return t.replace(TERM_RE, m => { if (seen.has(m)) return m; seen.add(m); return '<span class="term" data-term="' + esc(m) + '">' + m + '</span>'; });
}

const State = { year: 1883, sel: null };
const subs = []; const on = f => subs.push(f); const emit = () => subs.forEach(f => f());
function setYear(y) { y = clamp(Math.round(y), RANGE.min, RANGE.max); if (y === State.year) return; State.year = y; emit(); }

// ---------- 地球 ----------
const world = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe@2.45.2/example/img/earth-blue-marble.jpg')
  .backgroundColor('#050c16').width(innerWidth).height(innerHeight)
  .pointsData([]).pointLat('lat').pointLng('lng').pointColor('color').pointRadius('r').pointAltitude('alt').pointResolution(16).pointsTransitionDuration(0)
  .pointLabel(d => '<div style="background:rgba(10,16,26,.92);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:3px 8px;font-size:11px;color:#eef3f8">' + esc(d.label) + '</div>')
  .onPointClick((d, ev) => { select(d.key); openFor(d.key, ev ? { x: ev.clientX, y: ev.clientY } : null); }) // 押す＝選ぶだけ（カメラは動かさない）
  .ringsData([]).ringLat('lat').ringLng('lng').ringColor(() => t => 'rgba(200,244,255,' + (1 - t) + ')').ringMaxRadius(2.4).ringPropagationSpeed(1.6).ringRepeatPeriod(1300);
world.pointOfView({ lat: 37, lng: 138, altitude: 1.9 }, 0);
world.controls().autoRotate = false;
addEventListener('resize', () => { world.width(innerWidth).height(innerHeight); drawTL(); });

// 地球の点（key で選ぶ）：life:<placeId> / found:<id> / first:<id> / net:<id>
function points() {
  const y = State.year, out = [];
  if (y >= RANGE.max) NETWORK.forEach(d => out.push({ key: 'net:' + d.id, lat: d.lat, lng: d.lng, label: d.country, color: COL.net, r: 0.16, alt: 0.006 }));
  FIRST.filter(d => d.year <= y).forEach(d => out.push({ key: 'first:' + d.id, lat: d.lat, lng: d.lng, label: d.year + ' ' + d.region, color: COL.first, r: 0.24, alt: 0.008 }));
  FOUND.filter(d => d.year <= y).forEach(d => out.push({ key: 'found:' + d.id, lat: d.lat, lng: d.lng, label: d.year + ' ' + d.country, color: COL.spread, r: 0.3, alt: 0.01 }));
  PLACES.filter(p => +p.year <= y).forEach(p => out.push({ key: 'life:' + p.id, lat: p.lat, lng: p.lng, label: p.title, color: COL.life, r: 0.34, alt: 0.012 }));
  return out.map(p => p.key === State.sel ? { ...p, color: p.key.startsWith('life') ? COL.lifeBr : COL.spreadBr, r: p.r * 1.6, alt: 0.03 } : p);
}
function renderWorld() {
  const ps = points(); world.pointsData(ps);
  const s = ps.find(p => p.key === State.sel); world.ringsData(s ? [s] : []);
}
on(renderWorld);
function lookAt(key) { // カメラを動かすのはここだけ（「場所を見る」）
  const p = keyPlace(key); if (!p) return;
  world.pointOfView({ lat: p.lat, lng: p.lng, altitude: key.startsWith('life') ? 0.9 : 1.4 }, 1000);
}
function keyPlace(key) {
  const [k, id] = key.split(':');
  if (k === 'life') return placeById(id);
  if (k === 'found') return FOUND.find(d => d.id === id);
  if (k === 'first') return FIRST.find(d => d.id === id);
  if (k === 'net') return NETWORK.find(d => d.id === id);
  return null;
}
function select(key) { State.sel = key; emit(); }

// ---------- カード ----------
const card = document.getElementById('detailCard');
function showCard({ kind, tag, title, sub, html, look }, src) {
  card.className = 'dcard' + (kind ? ' k-' + kind : '');
  document.getElementById('dcTag').textContent = tag;
  document.getElementById('dcTitle').textContent = title;
  document.getElementById('dcSub').textContent = sub || '';
  const b = document.getElementById('dcBody'); b.innerHTML = html || ''; bindTerms(b);
  const act = document.getElementById('dcAct');
  act.hidden = !look; act.onclick = look ? () => lookAt(look) : null;
  card.hidden = false; card.scrollTop = 0; place(src);
}
function place(src) {
  const cw = card.offsetWidth || 340, ch = card.offsetHeight || 200, M = 12, W = innerWidth, H = innerHeight; let x, y;
  if (W <= 640) { card.style.left = '8px'; card.style.top = '52px'; return; }
  if (src && src.getBoundingClientRect) { const r = src.getBoundingClientRect(); x = r.left - cw - M; if (x < M) x = r.right + M; y = r.top; }
  else if (src && typeof src.x === 'number') { x = src.x + M; y = src.y + M; }
  else { x = 280; y = 120; }
  card.style.left = clamp(x, M, W - cw - M) + 'px'; card.style.top = clamp(y, 12, H - ch - M) + 'px';
}
function closeCard() { card.hidden = true; if (State.sel) select(null); }
document.getElementById('dcClose').onclick = closeCard;
(function () { // つかんで動かす
  const head = document.getElementById('dcHead'); let d = null;
  head.addEventListener('pointerdown', e => { const r = card.getBoundingClientRect(); d = { dx: e.clientX - r.left, dy: e.clientY - r.top }; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if (!d) return; card.style.left = clamp(e.clientX - d.dx, 4, innerWidth - card.offsetWidth - 4) + 'px'; card.style.top = clamp(e.clientY - d.dy, 4, innerHeight - 60) + 'px'; });
  const end = () => { d = null; }; head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
})();
const p = s => '<p class="dc-para">' + s + '</p>';
function openFor(key, src) {
  const [k, id] = key.split(':'), o = keyPlace(key); if (!o) return;
  if (k === 'life') showCard({ tag: 'LIFE / 生涯の拠点', title: o.title, sub: o.year + ' ・ ' + o.placeName, html: p(linkify(o.description, new Set())), look: key }, src);
  else if (k === 'found') showCard({ kind: 'spread', tag: 'DOJO / 道場の設立', title: o.country, sub: o.year + ' ・ ' + o.org, html: p(esc(o.note || '')), look: key }, src);
  else if (k === 'first') showCard({ kind: 'spread', tag: 'FIRST / 初の指導・訪問', title: o.region, sub: o.year + ' ・ ' + o.city, html: p(esc(o.note || '')), look: key }, src);
  else showCard({ kind: 'spread', tag: 'NETWORK / 合気会の海外組織', title: o.country, sub: o.city, html: p('合気会の海外組織がある国。点は代表の都市で、道場の所在地ではありません。'), look: key }, src);
}
function openChrono(c, src) {
  select(c.eventId ? 'life:' + c.eventId : null);
  const pl = c.eventId && placeById(c.eventId);
  showCard({ tag: 'LIFE / 年譜', title: c.year + '年' + (typeof c.age === 'number' ? '（' + c.age + '歳）' : c.age ? '（' + c.age + '）' : ''), sub: pl ? pl.title : '', html: p(linkify(c.text, new Set())), look: pl ? 'life:' + pl.id : null }, src);
}
function openWorld(w, src) {
  showCard({ kind: 'world', tag: 'WORLD / 同時代の世界', title: w.title, sub: w.endYear ? w.year + '–' + w.endYear : String(w.year),
    html: esc(w.description).split('\n\n').map(s => p(s)).join('') }, src);
}
function openTerm(t, src) { const g = GLOSSARY[t]; if (g) showCard({ kind: 'term', tag: 'TERM / 用語', title: g.title, sub: g.reading, html: p(esc(g.text)) }, src); }
function bindTerms(scope) { scope.querySelectorAll('.term').forEach(el => el.onclick = e => { e.stopPropagation(); openTerm(el.dataset.term, el); }); }

// ---------- 右：人物と年表 ----------
const portrait = document.getElementById('fpPortrait');
portrait.src = PERSON.portrait; portrait.onerror = () => portrait.remove();
const seen = new Set();
document.getElementById('fpLead').innerHTML = linkify(PERSON.relation, seen);
const lifeList = document.getElementById('lifeList'), focusPanel = document.getElementById('focusPanel');
CHRONO.forEach((c, i) => {
  const age = typeof c.age === 'number' ? c.age + '歳' : (c.age || '');
  const d = mk('div', 'chrono-item', '<div class="chrono-year">' + c.year + '<span class="age">' + esc(age) + '</span></div><div class="chrono-text">' + linkify(c.text, seen) + '</div>');
  d.dataset.i = i;
  d.onclick = e => { if (e.target.classList.contains('term')) return; setYear(c.year); openChrono(c, d); };
  lifeList.appendChild(d);
});
bindTerms(focusPanel);
let lastNow = -1;
on(() => {
  let now = -1; CHRONO.forEach((c, i) => { if (c.year <= State.year) now = i; });
  lifeList.querySelectorAll('.chrono-item').forEach(r => { const i = +r.dataset.i; r.classList.toggle('future', CHRONO[i].year > State.year); r.classList.toggle('now', i === now); });
  if (now !== lastNow) { const first = lastNow === -1; lastNow = now; if (first) return; const r = lifeList.querySelector('[data-i="' + now + '"]'); if (r) scrollInto(focusPanel, r); }
});
function scrollInto(box, row) { const c = box.getBoundingClientRect(), b = row.getBoundingClientRect(); if (b.top < c.top + 40 || b.bottom > c.bottom) box.scrollTo({ top: box.scrollTop + (b.top - c.top) - c.height / 2, behavior: playTimer ? 'auto' : 'smooth' }); }
const fpFold = document.getElementById('fpFold');
const setFold = v => { document.body.classList.toggle('fp-folded', v); fpFold.textContent = v ? '開く' : '畳む'; };
fpFold.onclick = () => setFold(!document.body.classList.contains('fp-folded'));
if (innerWidth <= 640) setFold(true);

// ---------- 左：世界の出来事 ----------
const worldList = document.getElementById('worldList');
[...WORLD].sort((a, b) => a.year - b.year).forEach(w => {
  const d = mk('div', 'we', '<span class="y">' + w.year + '</span><span class="t">' + esc(w.title) + '</span>');
  d.dataset.y = w.year; d.dataset.e = w.endYear || w.year;
  d.onclick = () => openWorld(w, d); worldList.appendChild(d);
});
on(() => worldList.querySelectorAll('.we').forEach(r => { r.classList.toggle('future', +r.dataset.y > State.year); r.classList.toggle('now', +r.dataset.y <= State.year && State.year <= +r.dataset.e); }));

// ---------- 出典（1か所） ----------
const infoBtn = document.getElementById('infoBtn'), infoPanel = document.getElementById('infoPanel');
document.getElementById('infoBody').innerHTML =
  '<div class="sec">出典</div>' +
  '<p class="ri-p">年表は、以前の合氣道版で採用した「植芝盛平年譜」（年表写真）をもとに、ネットで照合したもの。海外への広がりは『合気道のあゆみ』の周年の記述と各国の合気会の公式ページから。</p>' +
  '<ul><li><a href="https://www.aikikai.or.jp/aikido/history/" target="_blank" rel="noopener">合気会「沿革」</a>・<a href="https://www.aikikai.or.jp/aikido/message/" target="_blank" rel="noopener">「道主挨拶」</a>（2026-11-14 確認）</li>' +
  '<li><a href="https://aikikai.or.jp/eng/about/overseasorganization/" target="_blank" rel="noopener">合気会 海外組織一覧</a>（2026年7月時点。点は国の代表都市）</li></ul>' +
  '<div class="sec">資料で分かれるところ</div>' +
  '<ul><li>北海道への移住：合気会の沿革は1912年、道主挨拶の略歴は1911年（応募）とする。ここでは1912年。</li>' +
  '<li>1947年の改組・1961年のハワイ訪問：合気会の年譜には見当たらない（以前の合氣道版のまま載せている）。</li>' +
  '<li>海外の道場の設立年には、周年の記述から逆算したものを含む。</li></ul>' +
  '<p class="ri-p sub">掲載は植芝盛平と合気会に限ります。個人制作で、合気会の公式サイトではありません。</p>';
infoBtn.onclick = () => { infoPanel.hidden = !infoPanel.hidden; infoBtn.classList.toggle('on', !infoPanel.hidden); };
document.getElementById('infoClose').onclick = () => { infoPanel.hidden = true; infoBtn.classList.remove('on'); };
const calLink = document.getElementById('calLink');
if (CALENDAR_URL) calLink.href = CALENDAR_URL; else calLink.hidden = true;

// ---------- 下：年の帯（1本）----------
const tl = document.getElementById('tl'), NS = 'http://www.w3.org/2000/svg';
const tlYear = document.getElementById('tlYear'), tlEra = document.getElementById('tlEra');
const LIFE_YEARS = [...new Set(CHRONO.map(c => c.year))];
const SPREAD_YEARS = [...new Set([...FOUND, ...FIRST].map(d => d.year))];
const STOPS = [...new Set([...LIFE_YEARS, ...SPREAD_YEARS, RANGE.max])].sort((a, b) => a - b); // ‹ › と再生で止まる年
const xOf = y => (y - RANGE.min) / (RANGE.max - RANGE.min) * (tl.clientWidth || 600);
function drawTL() {
  const W = tl.clientWidth || 600, H = 46, yb = 22; tl.setAttribute('viewBox', '0 0 ' + W + ' ' + H); tl.innerHTML = '';
  const add = (tag, a, txt) => { const el = document.createElementNS(NS, tag); for (const k in a) el.setAttribute(k, a[k]); if (txt != null) el.textContent = txt; el.setAttribute('pointer-events', 'none'); tl.appendChild(el); return el; };
  add('line', { x1: 0, y1: yb, x2: W, y2: yb, stroke: 'rgba(255,255,255,.14)', 'stroke-width': 2 });
  add('line', { x1: xOf(1883.95), y1: yb, x2: xOf(1969.3), y2: yb, stroke: COL.life, 'stroke-width': 3, 'stroke-opacity': .5, 'stroke-linecap': 'round' }); // 生涯
  add('line', { x1: xOf(RANGE.min), y1: yb, x2: xOf(State.year), y2: yb, stroke: '#fff', 'stroke-width': 1, 'stroke-opacity': .5 });
  for (let y = 1900; y <= RANGE.max; y += 20) add('text', { x: xOf(y), y: H - 2, fill: '#7d8ea2', 'font-size': 9, 'font-family': 'monospace', 'text-anchor': 'middle' }, y);
  LIFE_YEARS.forEach(y => add('circle', { cx: xOf(y), cy: yb - 7, r: 2.2, fill: COL.life, 'fill-opacity': y <= State.year ? 1 : .35 }));
  SPREAD_YEARS.forEach(y => add('circle', { cx: xOf(y), cy: yb + 7, r: 2.2, fill: COL.spread, 'fill-opacity': y <= State.year ? 1 : .35 }));
  const cx = xOf(State.year);
  add('line', { x1: cx, y1: 4, x2: cx, y2: yb + 12, stroke: '#fff', 'stroke-width': 1.4 });
  add('circle', { cx, cy: yb, r: 5, fill: '#fff', stroke: '#050c16', 'stroke-width': 1.5 });
}
on(drawTL);
on(() => { tlYear.textContent = State.year >= RANGE.max ? '現在' : String(State.year); tlEra.textContent = eraOf(State.year); });
let dragging = false;
const yAt = e => { const r = tl.getBoundingClientRect(); return RANGE.min + (e.clientX - r.left) / r.width * (RANGE.max - RANGE.min); };
tl.addEventListener('pointerdown', e => { dragging = true; tl.setPointerCapture(e.pointerId); setYear(yAt(e)); });
tl.addEventListener('pointermove', e => { if (dragging) setYear(yAt(e)); });
tl.addEventListener('pointerup', () => { dragging = false; }); tl.addEventListener('pointercancel', () => { dragging = false; });
const nextStop = () => STOPS.find(y => y > State.year) ?? RANGE.max;
const prevStop = () => [...STOPS].reverse().find(y => y < State.year) ?? RANGE.min;
document.getElementById('prevY').onclick = () => { stopPlay(); setYear(prevStop()); };
document.getElementById('nextY').onclick = () => { stopPlay(); setYear(nextStop()); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') setYear(prevStop()); else if (e.key === 'ArrowRight') setYear(nextStop());
  else if (e.key === 'Escape') { closeCard(); infoPanel.hidden = true; infoBtn.classList.remove('on'); }
});
const playBtn = document.getElementById('playBtn'); let playTimer = null;
function stopPlay() { clearInterval(playTimer); playTimer = null; playBtn.textContent = '▶'; playBtn.classList.remove('on'); }
playBtn.onclick = () => {
  if (playTimer) return stopPlay();
  if (State.year >= RANGE.max) setYear(1883);
  playBtn.textContent = '❚❚'; playBtn.classList.add('on');
  playTimer = setInterval(() => { setYear(State.year + 1); if (State.year >= RANGE.max) stopPlay(); }, PLAY_MS);
};

emit();
window.__ueshiba = { State, world }; // 確かめ用
</script>
