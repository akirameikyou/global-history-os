function isActive(event, year){
  if(event.endYear){
    return event.startYear <= year && year <= event.endYear;
  }
  return event.startYear <= year;
}

function getEraInfo(year){
  if(year >= 1868) return '明治 / Meiji';
  if(year >= 1865) return '慶応 / Keiō';
  if(year >= 1864) return '元治 / Genji';
  if(year >= 1861) return '文久 / Bunkyū';
  if(year >= 1860) return '万延 / Man’en';
  if(year >= 1854) return '安政 / Ansei';
  if(year >= 1848) return '嘉永 / Kaei';
  if(year >= 1844) return '弘化 / Kōka';
  if(year >= 1830) return '天保 / Tenpō';
  if(year >= 1818) return '文政 / Bunsei';
  return '';
}
function goToConnection(year, focus){
  slider.value = year;
  timelineYear.innerText = year;

  renderTimelineEra(year);
  renderTimelineRoute(year);
  renderTimelineMeaning(year);
  renderYear(year);
  renderUI(year);

  if(focus === 'torishima'){
    const torishimaEvent = events.find(event =>
      event.startYear === year &&
      (
        event.title?.includes('鳥島') ||
        event.description?.includes('鳥島') ||
        event.routeLabel === 'TORISHIMA'
      )
    );

    world.pointOfView({
      lat: torishimaEvent?.lat ?? 30.48,
      lng: torishimaEvent?.lng ?? 140.30,
      altitude: 1.45
    }, 1200);
  }
}

function showLinkCard(person){
  linkCardKicker.innerText = person.relationType
    ? `P-LINK / PERSON / ${person.relationType}`
    : 'P-LINK / PERSON';

  linkCardTitle.innerText = person.fullName || person.label;
  linkCardYears.innerText = `${person.birthYear} — ${person.deathYear}`;
  linkCardRelationType.innerText = '';
  linkCardText.innerText = person.relation || '';
  linkCardAchievements.innerHTML = '';

  if(person.portrait){
    linkCardPortrait.innerHTML = `<img src="${person.portrait}" alt="${person.fullName || person.label}">`;
  }else{
    linkCardPortrait.innerText = person.label.slice(0, 2);
  }

  if(person.connectionTrace && person.connectionTrace.length){
    linkCardTrace.innerHTML = `
      <div class="link-card-trace-title">CONNECTION TRACE</div>
      ${person.connectionTrace.map(item => `
        <div class="link-card-trace-item">
          <span class="link-card-trace-year">${item.year}</span>
          <span
            class="${item.goToYear ? 'link-card-trace-link' : ''}"
            data-go-year="${item.goToYear || ''}"
            data-focus="${item.focus || ''}">
            ${item.text}
          </span>
          ${item.detail ? `<div>${item.detail}</div>` : ''}
        </div>
      `).join('')}
    `;

    linkCardTrace.querySelectorAll('[data-go-year]').forEach(el => {
      if(!el.dataset.goYear) return;

      el.onclick = () => {
        const year = parseInt(el.dataset.goYear);
        goToConnection(year, el.dataset.focus);
      };
    });
  }else{
    linkCardTrace.innerHTML = '';
  }

   linkCard.style.display = 'block';
  bringLinkCardToFront();
}

  linkCard.style.display = 'none';

  bringLinkCardToFront();
};  
let isDraggingLinkCard = false;
let linkCardDragOffsetX = 0;
let linkCardDragOffsetY = 0;

let floatingSheetZIndex = 100;

function bringLinkCardToFront(){
  floatingSheetZIndex += 1;
  linkCard.style.zIndex = floatingSheetZIndex;
}

linkCardKicker.onmousedown = e => {
  bringLinkCardToFront();

  isDraggingLinkCard = true;
  linkCard.classList.add('dragging');

  const rect = linkCard.getBoundingClientRect();
  linkCardDragOffsetX = e.clientX - rect.left;
  linkCardDragOffsetY = e.clientY - rect.top;

  linkCard.style.right = 'auto';
  linkCard.style.bottom = 'auto';
  linkCard.style.left = `${rect.left}px`;
  linkCard.style.top = `${rect.top}px`;
};

document.addEventListener('mousemove', e => {
  if(!isDraggingLinkCard) return;

  linkCard.style.left = `${e.clientX - linkCardDragOffsetX}px`;
  linkCard.style.top = `${e.clientY - linkCardDragOffsetY}px`;
});

document.addEventListener('mouseup', () => {
  if(!isDraggingLinkCard) return;

  isDraggingLinkCard = false;
  linkCard.classList.remove('dragging');
});

function renderWorldLinks(){

    const rootsContent = document.createElement('div');
    rootsContent.className = 'timeline-world-roots-content';

    rootsContent.innerHTML = worldRoots.map(root => {
      const rootsStart = 1775;
      const rootsEnd = 1800;
      const range = rootsEnd - rootsStart;

      const left = ((root.startYear - rootsStart) / range) * 100;

        4,
        ((root.endYear - root.startYear) / range) * 100

      return `
        <div style="position:relative;height:28px;margin-bottom:6px;">

          <div style="position:absolute;left:${left}%;top:19px;width:${width}%;height:4px;border-radius:999px;background:${root.color};box-shadow:0 0 8px ${root.color};"></div>
        </div>
      `;
    }).join('');

    timelineWorldLinks.appendChild(rootsContent);
  }

  worldLinks.forEach(link => {
    const startRatio = (link.startYear - 1800) / 100;
    const endRatio = (link.endYear - 1800) / 100;

    const left = Math.max(0, startRatio) * 100;
    const right = Math.min(1, endRatio) * 100;
    const width = Math.max(1, right - left);

    const lane = document.createElement('div');
    const activeYear = parseInt(slider.value);

const active =
  activeYear >= link.startYear &&
  activeYear <= link.endYear;
    
    lane.className = 'timeline-world-link-lane';
        
    const linkOpacity = active ? '1' : '0.32';
    const linkGlow = active
      ? `0 0 18px ${link.color}`
      : `0 0 4px ${link.color}`;
    
        lane.innerHTML = `
      <div class="timeline-world-link-label" style="opacity:${linkOpacity};">
        ${link.label}
      </div>
      <div class="timeline-world-link-line"></div>
      <div
        class="timeline-world-link-bar"
        style="
          left:${left}%;
          width:${width}%;
          background:${link.color};
          box-shadow:${linkGlow};
          opacity:${linkOpacity};
        ">
      </div>
    `;

    lane.onclick = () => {
      world.pointOfView({
        lat: link.lat,
        lng: link.lng,
        altitude: link.altitude || 1.6
      }, 1200);

            showLocationNotice(
        link.label,
        link.placeName || '',
        link.regionName || ''
      );

      showWorldLinkMapLabel(link);

      showWorldEventCard({
        title: link.label,
        year: link.startYear === link.endYear
          ? String(link.startYear)
          : `${link.startYear} — ${link.endYear}`,
        color: link.color || '#E69445',
        description: link.description || link.regionName || '',
        cardText: link.cardText || link.description || link.regionName || '',
        meaning: link.meaning || '',
        placeName: link.placeName || ''
      });
    };

    timelineWorldLinks.appendChild(lane);
  });
}

function renderPersonLinks(){
  timelineSubLanes.innerHTML = '';

  personLinks.forEach(person => {
    const startRatio = (person.birthYear - 1800) / 100;
    const endRatio = (person.deathYear - 1800) / 100;

    const left = Math.max(0, startRatio) * 100;
    const right = Math.min(1, endRatio) * 100;
    const width = Math.max(1, right - left);

    const lane = document.createElement('div');
    lane.className = 'timeline-sub-lane';

    lane.innerHTML = `

      </div>

    lane.onclick = () => {

    timelineSubLanes.appendChild(lane);
  });
}
  
function renderTimelineWorldBars(){
  timelineWorldLayer.innerHTML = '';

  const worldBarEvents = events.filter(event =>
    event.type === 'world' &&
    event.endYear &&
    event.startYear >= 1800 &&
    event.startYear <= 1900
  );

  worldBarEvents.forEach(event => {
    const startRatio = (event.startYear - 1800) / 100;
    const endRatio = (event.endYear - 1800) / 100;

    const left = Math.max(0, startRatio) * 100;
    const right = Math.min(1, endRatio) * 100;
    const width = Math.max(1, right - left);

    const bar = document.createElement('div');
    bar.className = 'timeline-world-bar';
    bar.style.left = `${left}%`;
    bar.style.width = `${width}%`;
    bar.style.background = event.color || '#ff5a5a';
    bar.style.boxShadow = `0 0 6px ${event.color || '#ff5a5a'}`;

    bar.title = `${event.year} ${event.title}`;

    timelineWorldLayer.appendChild(bar);
  });
}
function renderTimelineMarkers(){
  timelineMarkers.innerHTML = '';

  const markerYears = [
  ...new Set(
    events
      .filter(event =>
  event.type === 'person' &&
  event.timelineVisible !== false
)
      .map(event => event.startYear)
  )
];
  
  markerYears.forEach(markerYear => {
    const ratio = (markerYear - 1800) / 100;

    if (ratio < 0 || ratio > 1) return;

    const marker = document.createElement('div');
    marker.className = 'timeline-marker';
    marker.style.left = `${ratio * 100}%`;
    marker.title = String(markerYear);

    timelineMarkers.appendChild(marker);
  });
}

function renderTimelineEra(year){
  const era = getEraInfo(year);
  timelineEra.innerText = era ? `江戸後期・幕末 / ${era}` : '';
}

function renderTimelineRoute(year){
  const routeLabels = events
    .filter(event =>
      event.routeLabel &&
      event.startYear === year
    )
    .map(event => event.routeLabel);

  const uniqueRouteLabels = [...new Set(routeLabels)];

  timelineRoute.innerText = uniqueRouteLabels.join('  /  ');
}

function renderTimelineMeaning(year){
  const durationEvent = events.find(event =>
    event.timelineType === 'duration' &&
    event.durationLabel &&
    event.startYear <= year &&
    year <= event.endYear
  );

  timelineMeaning.innerText = durationEvent
    ? durationEvent.durationLabel
    : '';
}

function renderUI(year){
  worldEventsEl.innerHTML = '';
  timeline.innerHTML = '';

  const worldEvents = events.filter(
    event => event.type === 'world' && isActive(event, year)
  );

  const personEvents = events.filter(
  event =>
    event.type === 'person' &&
    event.timelineVisible !== false &&
    event.startYear <= year
);

  worldEvents.forEach(event => {
    const item = document.createElement('div');
    item.className = 'event-item';

    item.innerHTML = `
      <div class="event-bar" style="background:${event.color};"></div>
      <div class="event-content">
        <div class="event-year" style="color:${event.color};">${event.year}</div>
        <div class="event-title">${event.title}</div>
        <div class="event-description">${event.description}</div>
      </div>
    `;

    item.onclick = () => {
  world.pointOfView({
    lat: event.lat,
    lng: event.lng,
    altitude: 1.6
  }, 1200);

  showWorldEventCard(event);
};

    worldEventsEl.appendChild(item);
  });

  personEvents.forEach(event => {
    const item = document.createElement('div');
    item.className = 'timeline-item';

    item.innerHTML = `
      <div class="timeline-text">
        <span class="timeline-inline-year">
          ${event.year}

      world.pointOfView({
        lat: event.lat,
        lng: event.lng,
        altitude: 1.4
      }, 1200);
    };

    timeline.appendChild(item);
  });
}
