<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

.city-label{

position:absolute;

color:white;

font-size:10px;
font-weight:400;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

letter-spacing:0.5px;

text-shadow:
0 0 6px rgba(0,255,255,0.65);

opacity:0.92;

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from
'https://esm.sh/globe.gl@2.32.0';

import { events }
from '../data/events.js';

const world =

Globe()(
document.getElementById(
'globeViz'
)
)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

const labels =

events.map(event => ({

name:
event.placeName,

lat:
event.lat,

lng:
event.lng,

importance:
event.importance

}));

const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(e=>e.id===id);

if(!target) return;

const dx =
event.lat - target.lat;

const dy =
event.lng - target.lng;

const dist = Math.sqrt(
(dx * dx) +
(dy * dy)
);

let altitude =
dist * 0.0035;

if(altitude < 0.03)
altitude = 0.03;

if(altitude > 0.22)
altitude = 0.22;

let color = '#66ffff';

if(
event.tags.includes('開国')
){

color = '#ffe066';

}

if(
event.tags.includes('漂流')
){

color = '#88ffcc';

}

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color,
altitude

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.12)

.arcAltitude('altitude')

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0);

world.ringsData([

{

lat:36,
lng:138,

maxR:8,

propagationSpeed:0.25,

repeatPeriod:4200,

color:()=>

'rgba(0,255,255,0.08)'

}

])

.ringColor('color')

.ringMaxRadius('maxR')

.ringPropagationSpeed(
'propagationSpeed'
)

.ringRepeatPeriod(
'repeatPeriod'
);

const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.body
.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const camPos =

world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const pos =

world.getCoords(

label.lat,
label.lng,
0.02

);

const len = Math.sqrt(

(pos.x * pos.x) +

(pos.y * pos.y) +

(pos.z * pos.z)

);

const nx =
pos.x / len;

const ny =
pos.y / len;

const nz =
pos.z / len;

const dot =

(nx * camPos.x) +

(ny * camPos.y) +

(nz * camPos.z);

if(dot < 0.12){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
screen.x + 'px';

label.el.style.top =
screen.y + 'px';

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
