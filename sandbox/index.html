<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sandbox Globe</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;
}

#globeViz{
position:absolute;
inset:0;
}

.city-label{

position:absolute;

color:white;

font-size:22px;
font-weight:700;

text-shadow:
0 0 10px rgba(0,0,0,1),
0 0 20px rgba(0,0,0,1);

pointer-events:none;

white-space:nowrap;

/* ← 重要 */
transform:translate(-50%,-50%);

will-change:transform,left,top;

}

</style>
</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from 'https://esm.sh/globe.gl@2.32.0';

const world =
world.pointOfView({
  lat:30,
  lng:140,
  altitude:2.2
});  
Globe()(document.getElementById('globeViz'))

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)
.height(window.innerHeight);

const labels = [

{
name:'東京',
lat:35.68,
lng:139.69
},

{
name:'ハワイ',
lat:21.30,
lng:-157.85
}

];

const labelEls = [];

labels.forEach(city=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
city.name;

document.body.appendChild(div);

labelEls.push({

el:div,
lat:city.lat,
lng:city.lng

});

});

function updateLabels(){

const camera =
world.camera();

const camPos =
camera.position.clone().normalize();

labelEls.forEach(label=>{

const pos =
world.getCoords(
label.lat,
label.lng,
0.02
);

const lat =
label.lat * Math.PI / 180;

const lng =
label.lng * Math.PI / 180;

const x =
Math.cos(lat) *
Math.cos(lng);

const y =
Math.sin(lat);

const z =
Math.cos(lat) *
Math.sin(lng);

const length =
Math.sqrt(
x*x + y*y + z*z
);

const nx = x / length;
const ny = y / length;
const nz = z / length;

const dot =
(nx * camPos.x) +
(ny * camPos.y) +
(nz * camPos.z);

if(dot <= 0.45){

label.el.style.display =
'none';

return;

}

const screen =
world.getScreenCoords(
label.lat,
label.lng
);

if(!screen){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
screen.x + 'px';

label.el.style.top =
screen.y + 'px';

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(
'resize',
()=>{

world
.width(window.innerWidth)
.height(window.innerHeight);

}
);

</script>

</body>
</html>
