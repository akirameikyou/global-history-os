<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>History OS / John Manjiro Mode</title>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;font-family:Arial,sans-serif;}
#globeViz{position:absolute;inset:0;z-index:1;}
.city-label{position:absolute;color:white;font-size:11px;font-weight:400;letter-spacing:0.04em;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 8px rgba(0,0,0,1);z-index:5;}

#title{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;}
.title-main{font-size:15px;letter-spacing:0.38em;font-weight:600;color:white;opacity:0.92;}
.title-sub{margin-top:8px;font-size:11px;letter-spacing:0.16em;color:rgba(255,255,255,0.38);}

.left-panel{position:absolute;top:70px;left:52px;width:360px;bottom:60px;overflow-y:auto;z-index:20;padding-right:12px;}
.section-title{font-size:13px;letter-spacing:0.28em;color:rgba(255,255,255,0.52);margin-bottom:4px;}

.event-item{display:flex;gap:16px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;}
.event-bar{width:3px;border-radius:999px;flex-shrink:0;}
.event-content{flex:1;}
.event-year{font-size:13px;font-weight:600;margin-bottom:10px;}
.event-title{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:10px;color:white;}
.event-description{font-size:14px;line-height:2;color:rgba(255,255,255,0.7);}

.right-panel{position:absolute;top:70px;right:52px;width:390px;bottom:60px;overflow-y:auto;z-index:20;padding-right:8px;}
.person-name{font-size:28px;font-weight:700;line-height:1.18;margin-bottom:16px;color:white;letter-spacing:0.18em;text-transform:uppercase;}
.person-years{font-size:14px;letter-spacing:0.2em;color:#66e0ff;margin-bottom:30px;}
.person-image{width:92px;height:92px;border-radius:999px;object-fit:cover;margin-bottom:30px;border:1px solid rgba(255,255,255,0.16);}
.person-description{font-size:14px;line-height:2.15;color:rgba(255,255,255,0.78);font-weight:300;margin-bottom:46px;max-width:320px;}

.timeline-item{margin-bottom:34px;cursor:pointer;}
.timeline-year{font-size:13px;font-weight:700;letter-spacing:0.16em;color:#66e0ff;margin-bottom:10px;}
.timeline-text{font-size:14px;line-height:1.55;color:rgba(255,255,255,0.84);}
.timeline-inline-year{
color:#66e0ff;
font-weight:700;
letter-spacing:0.12em;
}
#timelineBar{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:30;width:520px;display:flex;flex-direction:column;align-items:center;gap:12px;}
#timelineYear{
font-size:14px;
letter-spacing:0.25em;
color:white;
opacity:0.8;
height:18px;
line-height:18px;
text-align:center;
}
#yearSlider{width:520px;appearance:none;height:2px;background:rgba(255,255,255,0.25);outline:none;}
#yearSlider::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:999px;background:#66e0ff;cursor:pointer;box-shadow:0 0 18px rgba(102,224,255,0.8);}

#timelineTrack{
position:relative;
width:520px;
height:12px;
margin-top:-2px;
pointer-events:auto;
}

#timelineBaseLine{
position:absolute;
left:0;
top:6px;
width:100%;
height:1px;
background:rgba(255,255,255,0.18);
}

#timelineWorldLayer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;  
}
.timeline-world-bar{
position:absolute;
height:3px;
border-radius:999px;
opacity:0.9;
}

.timeline-world-war{
background:#ff5a5a;
box-shadow:0 0 8px rgba(255,90,90,0.7);
}

.timeline-world-tech{
background:#ffd95e;
box-shadow:0 0 8px rgba(255,217,94,0.7);
}

.timeline-world-civilization{
background:#57ffb1;
box-shadow:0 0 8px rgba(87,255,177,0.7);
}
#timelineLifeLayer{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;  
}

.life-span-bar{
position:absolute;
top:3px;
height:5px;
border-radius:999px;
background:white;
box-shadow:0 0 10px rgba(255,255,255,0.7);
opacity:0.9;
}

#timelineMarkers{
position:absolute;
left:0;
top:0;
width:520px;
height:12px;
pointer-events:none;  
}

.timeline-marker{
position:absolute;
top:2px;
width:6px;
height:6px;
border-radius:999px;
background:#66e0ff;
box-shadow:0 0 10px rgba(102,224,255,0.85);
transform:translateX(-50%);
}
#timelineEra{
margin-top:2px;
margin-bottom:6px;
font-size:11px;
letter-spacing:1px;
color:#ffd95e;
opacity:0.86;
height:16px;
line-height:16px;
}

#timelineRoute{
font-size:12px;
letter-spacing:0.28em;
color:#66e0ff;
opacity:0.92;
height:16px;
line-height:16px;
text-transform:uppercase;
}

#timelineTicks{
width:520px;
display:flex;
justify-content:space-between;
font-size:10px;
letter-spacing:0.12em;
color:rgba(255,255,255,0.46);
margin-top:-4px;
}

#timelineTicks span{
display:block;
}

#timelineMeaning{
margin-top:6px;
font-size:12px;
color:#66e0ff;
opacity:0.8;
height:18px;
line-height:18px;
}  
</style>
</head>

<body>

<div id="globeViz"></div>

<div id="title">
  <div class="title-main">HISTORY OS</div>
  <div class="title-sub">John Manjiro Mode / Civilization Meaning Interface</div>
</div>

<div class="left-panel">
  <div class="section-title">WORLD EVENTS</div>
  <div id="worldEvents"></div>
</div>

<div class="right-panel">
  <div class="person-name">JOHN<br>MANJIRO</div>
  <div class="person-years">1827 — 1898</div>

  <img
    class="person-image"
    src="https://upload.wikimedia.org/wikipedia/commons/2/2c/Nakahama_Manjiro.jpg"
  />

  <div class="person-description">
    ジョン万次郎は、日本とアメリカを結んだ幕末の航海者。
    漂流、鳥島でのサバイバル、アメリカ渡航、帰国後の開国支援まで、
    19世紀の太平洋世界を横断した人物。
  </div>

  <div id="timeline"></div>
</div>

<button id="borderToggle">BORDERS</button>

<div id="timelineBar">
  <div id="timelineYear">1850</div>
  <div id="timelineEra"></div>
  <div id="timelineRoute"></div>
  <input type="range" id="yearSlider" min="1800" max="1900" value="1850"/>

<div id="timelineTrack">
  <div id="timelineBaseLine"></div>

  <div id="timelineWorldLayer">

  <div
    class="timeline-world-bar timeline-world-war"
    style="
      left:72%;
      width:10%;
      top:0px;
    ">
  </div>

  <div
    class="timeline-world-bar timeline-world-tech"
    style="
      left:38%;
      width:8%;
      top:0px;
    ">
  </div>

</div>

  <div id="timelineLifeLayer">
    <div class="life-span-bar" style="left:27%;width:71%;"></div>
  </div>

  <div id="timelineMarkers"></div>
</div>
  <div id="timelineTicks">
  <span>1800</span>
  <span>1825</span>
  <span>1850</span>
  <span>1875</span>
  <span>1900</span>
</div>
  <div id="timelineMeaning"></div>
</div>

<script type="module">
import { events } from '../data/events.js';

import {
  world,
  renderYear,
  toggleBorders
} from './renderGlobe.js';

const worldEventsEl = document.getElementById('worldEvents');
const timeline = document.getElementById('timeline');
const borderToggle = document.getElementById('borderToggle');
const slider = document.getElementById('yearSlider');
const timelineYear = document.getElementById('timelineYear');
const timelineMeaning = document.getElementById('timelineMeaning');
const timelineEra = document.getElementById('timelineEra');
const timelineRoute = document.getElementById('timelineRoute');
const timelineMarkers = document.getElementById('timelineMarkers');  
borderToggle.onclick = () => {
  toggleBorders();
};

function isActive(event, year){
  if(event.endYear){
    return event.startYear <= year && year <= event.endYear;
  }
  return event.startYear <= year;
}
function getEraInfo(year){
  if(year >= 1868) return '明治 / Meiji';
  if(year >= 1865) return '慶応 / Keiō';
  if(year >= 1864) return '元治 / Genji';
  if(year >= 1861) return '文久 / Bunkyū';
  if(year >= 1860) return '万延 / Man’en';
  if(year >= 1854) return '安政 / Ansei';
  if(year >= 1848) return '嘉永 / Kaei';
  if(year >= 1844) return '弘化 / Kōka';
  if(year >= 1830) return '天保 / Tenpō';
  if(year >= 1818) return '文政 / Bunsei';
  return '';
}
function renderTimelineMarkers(){
  timelineMarkers.innerHTML = '';

  const markerYears = [
    ...new Set(
      events
        .filter(event => event.type === 'person' || event.type === 'world')
        .map(event => event.startYear)
    )
  ];

  markerYears.forEach(markerYear => {
    const ratio = (markerYear - 1800) / 100;

    if (ratio < 0 || ratio > 1) return;

    const marker = document.createElement('div');
    marker.className = 'timeline-marker';
    marker.style.left = `${ratio * 100}%`;
    marker.title = String(markerYear);

    timelineMarkers.appendChild(marker);
  });
}
function renderTimelineEra(year){
  const era = getEraInfo(year);
  timelineEra.innerText = era ? `江戸後期・幕末 / ${era}` : '';
} 
function renderTimelineRoute(year){
  const routeLabels = events
    .filter(event =>
      event.routeLabel &&
      event.startYear === year
    )
    .map(event => event.routeLabel);

  const uniqueRouteLabels = [...new Set(routeLabels)];

  timelineRoute.innerText = uniqueRouteLabels.join('  /  ');
}
function renderTimelineMeaning(year){
  const durationEvent = events.find(event =>
    event.timelineType === 'duration' &&
    event.durationLabel &&
    event.startYear <= year &&
    year <= event.endYear
  );

  timelineMeaning.innerText = durationEvent
    ? durationEvent.durationLabel
    : '';
}
function renderUI(year){
  worldEventsEl.innerHTML = '';
  timeline.innerHTML = '';

  const worldEvents = events.filter(
    event => event.type === 'world' && isActive(event, year)
  );

  const personEvents = events.filter(
  event =>
    event.type === 'person' &&
    event.startYear <= year
);

  worldEvents.forEach(event => {
    const item = document.createElement('div');
    item.className = 'event-item';

    item.innerHTML = `
      <div class="event-bar" style="background:${event.color};"></div>
      <div class="event-content">
        <div class="event-year" style="color:${event.color};">${event.year}</div>
        <div class="event-title">${event.title}</div>
        <div class="event-description">${event.description}</div>
      </div>
    `;

    item.onclick = () => {
      world.pointOfView({
        lat: event.lat,
        lng: event.lng,
        altitude: 1.6
      }, 1200);
    };

    worldEventsEl.appendChild(item);
  });

  personEvents.forEach(event => {
    const item = document.createElement('div');
    item.className = 'timeline-item';

    item.innerHTML = `
  <div class="timeline-text">
  <span class="timeline-inline-year">
    ${event.year}
  </span>
  　${event.description}
</div>
`;

    item.onclick = () => {
      world.pointOfView({
        lat: event.lat,
        lng: event.lng,
        altitude: 1.4
      }, 1200);
    };

    timeline.appendChild(item);
  });
}
renderTimelineMarkers();
renderYear(1850);
renderUI(1850);
renderTimelineEra(1850);
renderTimelineRoute(1850);
renderTimelineMeaning(1850);

slider.addEventListener('input', e => {
  const year = parseInt(e.target.value);
  timelineYear.innerText = year;
  
  renderTimelineEra(year);
  renderTimelineRoute(year);
  renderTimelineMeaning(year);
  renderYear(year);
  renderUI(year);
});
</script>

</body>
</html>
