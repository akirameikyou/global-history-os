<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global History Map</title>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;font-family:Arial,sans-serif;}
#globeViz{position:absolute;inset:0;z-index:1;}
.city-label{position:absolute;color:white;font-size:11px;font-weight:400;letter-spacing:0.04em;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 8px rgba(0,0,0,1);z-index:5;}
#title{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;}
.title-main{font-size:15px;letter-spacing:0.38em;font-weight:600;color:white;opacity:0.92;}
.title-sub{margin-top:8px;font-size:11px;letter-spacing:0.16em;color:rgba(255,255,255,0.38);}
.left-panel{position:absolute;top:70px;left:52px;width:360px;bottom:60px;overflow-y:auto;z-index:20;padding-right:12px;}
.section-title{font-size:13px;letter-spacing:0.28em;color:rgba(255,255,255,0.52);margin-bottom:26px;}
.event-item{display:flex;gap:16px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;}
.event-bar{width:3px;border-radius:999px;flex-shrink:0;}
.event-content{flex:1;}
.event-year{font-size:13px;font-weight:600;margin-bottom:10px;}
.event-title{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:10px;color:white;}
.event-description{font-size:14px;line-height:2;color:rgba(255,255,255,0.7);}
.right-panel{position:absolute;top:70px;right:52px;width:340px;bottom:60px;overflow-y:auto;z-index:20;padding-right:8px;}
.person-name{font-size:28px;font-weight:700;line-height:1.18;margin-bottom:16px;color:white;letter-spacing:0.18em;text-transform:uppercase;}
.person-years{font-size:14px;letter-spacing:0.2em;color:#66e0ff;margin-bottom:30px;}
.person-image{width:92px;height:92px;border-radius:999px;object-fit:cover;margin-bottom:30px;border:1px solid rgba(255,255,255,0.16);}
.person-description{font-size:14px;line-height:2.15;color:rgba(255,255,255,0.78);font-weight:300;margin-bottom:46px;max-width:320px;}
.timeline-item{margin-bottom:34px;cursor:pointer;}
.timeline-year{font-size:13px;font-weight:700;letter-spacing:0.16em;color:#66e0ff;margin-bottom:10px;}
.timeline-text{font-size:14px;line-height:2;color:rgba(255,255,255,0.84);}
#timelineBar{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:30;width:520px;display:flex;flex-direction:column;align-items:center;gap:12px;}
#timelineYear{font-size:14px;letter-spacing:0.25em;color:white;opacity:0.8;}
#yearSlider{width:520px;appearance:none;height:2px;background:rgba(255,255,255,0.25);outline:none;}
#yearSlider::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:999px;background:#66e0ff;cursor:pointer;box-shadow:0 0 18px rgba(102,224,255,0.8);}
#borderToggle{

position:absolute;

left:50%;
bottom:92px;

transform:
translateX(-50%);

z-index:40;

background:
rgba(255,255,255,0.08);

border:
1px solid rgba(255,255,255,0.18);

color:white;

padding:
10px 22px;

letter-spacing:0.2em;

font-size:11px;

cursor:pointer;

backdrop-filter:blur(10px);

}
</style>
</head>

<body>

<body>

<div id="app">

  <header id="topBar">
    <div class="logoArea">
      <div class="appTitle">History OS</div>
      <div class="modeTitle">John Manjiro Mode</div>
    </div>
  </header>

  <main id="mainLayout">

    <!-- LEFT : WORLD -->

    <aside id="leftPanel">

      <section class="panelSection">

        <h2>WORLD EVENTS</h2>

        <div class="eventItem">
          <span class="year">1840</span>
          アヘン戦争
        </div>

        <div class="eventItem">
          <span class="year">1848</span>
          ゴールドラッシュ
        </div>

        <div class="eventItem">
          <span class="year">1853</span>
          ペリー来航
        </div>

        <div class="eventItem">
          <span class="year">1861</span>
          アメリカ南北戦争
        </div>

      </section>

    </aside>

    <!-- CENTER : GLOBE -->

    <section id="centerArea">
      <div id="globeViz"></div>
    </section>

    <!-- RIGHT : PERSON -->

    <aside id="rightPanel">

      <section class="panelSection">

        <h2>PERSON</h2>

        <h3>中浜万次郎</h3>

        <div class="timelineItem">
          <span class="year">1827</span>
          土佐清水周辺に生まれる
        </div>

        <div class="timelineItem">
          <span class="year">1841</span>
          漂流し鳥島へ漂着
        </div>

        <div class="timelineItem">
          <span class="year">1841</span>
          鳥島143日サバイバル
        </div>

        <div class="timelineItem">
          <span class="year">1842</span>
          ハワイへ
        </div>

        <div class="timelineItem">
          <span class="year">1843</span>
          アメリカ本土へ
        </div>

        <div class="timelineItem">
          <span class="year">1848</span>
          ゴールドラッシュ期
        </div>

        <div class="timelineItem">
          <span class="year">1851</span>
          琉球へ帰着
        </div>

        <div class="timelineItem">
          <span class="year">1860</span>
          咸臨丸で再渡米
        </div>

        <div class="timelineItem">
          <span class="year">1898</span>
          東京で死去
        </div>

      </section>

    </aside>

  </main>

  <!-- BOTTOM TIMELINE -->

  <footer id="bottomTimeline">

    <div id="timelineTrack">

      <div class="century">1600</div>
      <div class="century">1700</div>
      <div class="century activeCentury">1800</div>
      <div class="century">1900</div>
      <div class="century">2000</div>

    </div>

  </footer>

</div>

<script type="module" src="./main.js"></script>

</body>

</body>
</html>
