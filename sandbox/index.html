<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Global History Map</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;

background:black;

font-family:
Arial,
sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

#siteTitle{

position:absolute;

top:18px;
left:50%;

transform:
translateX(-50%);

color:white;

font-size:18px;

letter-spacing:4px;

font-weight:600;

opacity:0.82;

z-index:20;

pointer-events:none;

}

.city-label{

position:absolute;

color:white;

font-size:12px;

font-weight:500;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 6px rgba(0,0,0,1);

}

#leftPanel{

position:absolute;

left:0;
top:0;

width:420px;
height:100vh;

padding:38px 28px;

box-sizing:border-box;

background:
linear-gradient(
90deg,
rgba(0,0,0,0.82),
rgba(0,0,0,0.22),
transparent
);

z-index:10;

overflow-y:auto;

}

#rightPanel{

position:absolute;

right:0;
top:0;

width:380px;
height:100vh;

padding:42px 30px;

box-sizing:border-box;

background:
linear-gradient(
-90deg,
rgba(0,0,0,0.82),
rgba(0,0,0,0.18),
transparent
);

z-index:10;

overflow-y:auto;

color:white;

}

.panelTitle{

font-size:13px;

letter-spacing:3px;

color:
rgba(255,255,255,0.45);

margin-bottom:28px;

}

.eventCard{

padding:18px 0;

border-bottom:
1px solid rgba(255,255,255,0.06);

}

.eventYear{

font-size:11px;

letter-spacing:2px;

color:#66e0ff;

margin-bottom:8px;

}

.eventName{

font-size:20px;

font-weight:600;

margin-bottom:10px;

color:white;

}

.eventDesc{

font-size:13px;

line-height:1.7;

color:
rgba(255,255,255,0.65);

}

#personName{

font-size:34px;

font-weight:700;

margin-bottom:8px;

}

#personYears{

font-size:13px;

letter-spacing:2px;

color:#66e0ff;

margin-bottom:24px;

}

#personPortrait{

width:100%;

border-radius:18px;

margin-bottom:24px;

}

#personText{

font-size:14px;

line-height:1.9;

color:
rgba(255,255,255,0.72);

margin-bottom:36px;

}

.timelineItem{

margin-bottom:22px;

}

.timelineYear{

font-size:11px;

letter-spacing:2px;

color:#66e0ff;

margin-bottom:5px;

}

.timelineText{

font-size:15px;

line-height:1.7;

}

</style>

</head>

<body>

<div id="siteTitle">
GLOBAL HISTORY MAP
</div>

<div id="globeViz"></div>

<div id="leftPanel">

<div class="panelTitle">
WORLD EVENTS
</div>

<div id="eventList"></div>

</div>

<div id="rightPanel">

<div id="personName">
ジョン万次郎
</div>

<div id="personYears">
1827 — 1898
</div>

<img
id="personPortrait"
src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Nakahama_Manjirō.jpg"
/>

<div id="personText">

日本とアメリカ文明を結んだ幕末の航海者。

漂流からアメリカ渡航、
帰国後の開国支援まで、
文明接続の象徴的人物。

</div>

<div id="personTimeline"></div>

</div>

<script type="module">

import Globe
from 'https://esm.sh/globe.gl@2.32.0';

import { events }
from '../data/events.js';

const world = Globe()(

document.getElementById(
'globeViz'
)

)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
'black'
)

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:160,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(
e=>e.id===id
);

if(!target) return;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:'#66e0ff'

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.05)

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0)

.arcAltitudeAutoScale(0.16);

const labels = [];

events.forEach(event=>{

const exists =
labels.find(
l=>l.name===event.placeName
);

if(exists) return;

labels.push({

name:event.placeName,

lat:event.lat,
lng:event.lng

});

});

const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.body.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const camPos =

world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const pos =

world.getCoords(

label.lat,
label.lng,
0.02

);

const len = Math.sqrt(

(pos.x * pos.x) +

(pos.y * pos.y) +

(pos.z * pos.z)

);

const nx = pos.x / len;
const ny = pos.y / len;
const nz = pos.z / len;

const dot =

(nx * camPos.x) +

(ny * camPos.y) +

(nz * camPos.z);

if(dot < 0.18){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
`${screen.x}px`;

label.el.style.top =
`${screen.y}px`;

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

const eventList =
document.getElementById(
'eventList'
);

events

.filter(
e=>e.type !== 'person_event'
)

.forEach(event=>{

const card =
document.createElement('div');

card.className =
'eventCard';

card.innerHTML =

`
<div class="eventYear">
${event.year}
</div>

<div class="eventName">
${event.title}
</div>

<div class="eventDesc">
${event.description}
</div>
`;

eventList.appendChild(card);

});

const personTimeline =
document.getElementById(
'personTimeline'
);

events

.filter(
e=>e.type === 'person_event'
)

.forEach(event=>{

const item =
document.createElement('div');

item.className =
'timelineItem';

item.innerHTML =

`
<div class="timelineYear">
${event.year}
</div>

<div class="timelineText">
${event.description}
</div>
`;

personTimeline.appendChild(
item
);

});

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
