<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS Sandbox</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;

font-family:
Arial,
sans-serif;

}

#globeViz{

width:100vw;
height:100vh;

}

.city-label{

position:absolute;

color:white;

font-size:13px;

font-weight:500;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 5px rgba(120,220,255,0.75);

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import * as THREE
from 'https://esm.sh/three@0.160.0';

import Globe
from 'https://esm.sh/globe.gl';

import { events }
from '../data/events.js';

const world = Globe()(

document.getElementById(
'globeViz'
)

)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
'black'
);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

if(!event.relatedEvents) return;

event.relatedEvents.forEach(targetId=>{

const target =
events.find(
e=>e.id === targetId
);

if(!target) return;

const distance = Math.sqrt(

Math.pow(
event.lat - target.lat,
2
)

+

Math.pow(
event.lng - target.lng,
2
)

);

let altitude =
distance * 0.0014;

if(altitude < 0.025)
altitude = 0.025;

if(altitude > 0.16)
altitude = 0.16;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:event.lineColor
|| '#66e0ff',

altitude

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcAltitude('altitude')

.arcStroke(0.22)

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0);

const labelEls = [];

events.forEach(event=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
event.placeName;

document.body.appendChild(div);

labelEls.push({

el:div,

lat:event.lat,
lng:event.lng

});

});

function updateLabels(){

const camPos =
world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const phi =
(90 - label.lat)
* Math.PI / 180;

const theta =
(label.lng + 180)
* Math.PI / 180;

const pos =
new THREE.Vector3(

-Math.sin(phi)
* Math.cos(theta),

Math.cos(phi),

Math.sin(phi)
* Math.sin(theta)

);

const dot =
camPos.dot(pos);

if(dot < 0.18){

label.el.style.display =
'none';

return;

}

const screen =
world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
`${screen.x}px`;

label.el.style.top =
`${screen.y}px`;

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
