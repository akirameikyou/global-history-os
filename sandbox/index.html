<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content=
"width=device-width,initial-scale=1.0"
/>

<title>
History OS Sandbox
</title>

<style>

html,
body{

margin:0;
padding:0;

overflow:hidden;

background:black;

font-family:sans-serif;

}

#globeViz{

width:100vw;
height:100vh;

}

.city-label{

position:absolute;

color:white;

pointer-events:none;

font-weight:600;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 8px rgba(0,255,255,0.9);

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from
'https://esm.sh/globe.gl@2.32.0';

import {
events
}

from
'../data/events.js';

const world =

Globe()(

document
.getElementById(

'globeViz'

)

)

.globeImageUrl(

'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'

)

.backgroundColor(

'black'

)

.width(

window.innerWidth

)

.height(

window.innerHeight

);

world.pointOfView({

lat:30,
lng:140,

altitude:2.2

});

const labels =

events.map(event=>({

name:
event.label_en,

lat:
event.lat,

lng:
event.lng,

year:
event.year,

importance:
event.importance,

relatedEvents:
event.relatedEvents

}));

const arcs = [];

events.forEach(event=>{

event.relatedEvents
.forEach(id=>{

const target =

events.find(
e=>e.id===id
);

if(!target) return;

arcs.push({

startLat:
event.lat,

startLng:
event.lng,

endLat:
target.lat,

endLng:
target.lng,

color:[

'#00ffff',
'#ffff88'

]

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.25)

.arcDashLength(0.25)

.arcDashGap(0.12)

.arcDashAnimateTime(4000)

.arcAltitude(0.12);

world.ringsData([

{

lat:36,
lng:138,

maxR:14,

propagationSpeed:0.6,

repeatPeriod:2600,

color:()=>

'rgba(0,255,255,0.22)'

}

])

.ringColor('color')

.ringMaxRadius('maxR')

.ringPropagationSpeed(
'propagationSpeed'
)

.ringRepeatPeriod(
'repeatPeriod'
);

const labelEls = [];

labels.forEach(label=>{

const div =

document
.createElement('div');

div.className =
'city-label';

const size =

8 +

(label.importance
* 0.08);

div.style.fontSize =

size + 'px';

div.innerText =
label.name;

document.body
.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,

lng:label.lng,

importance:
label.importance

});

});

function updateLabels(){

const camPos =

world
.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const lat =

label.lat
* Math.PI
/ 180;

const lng =

label.lng
* Math.PI
/ 180;

const x =

Math.cos(lat)
*
Math.cos(lng);

const y =

Math.sin(lat);

const z =

Math.cos(lat)
*
Math.sin(lng);

const surface = {

x,
y,
z

};

const dot =

surface.x
*
camPos.x

+

surface.y
*
camPos.y

+

surface.z
*
camPos.z;

if(dot < 0.15){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =

screen.x + 'px';

label.el.style.top =

screen.y + 'px';

});

requestAnimationFrame(

updateLabels

);

}

updateLabels();

window
.addEventListener(

'resize',

()=>{

world.width(
window.innerWidth
);

world.height(
window.innerHeight
);

}

);

</script>

</body>

</html>
