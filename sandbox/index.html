<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sandbox Globe</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;
}

#globeViz{
position:absolute;
inset:0;
}

.city-label{

position:absolute;

color:white;

font-size:22px;
font-weight:bold;

pointer-events:none;

white-space:nowrap;

transform:translate(-50%,-50%);

text-shadow:
0 0 10px rgba(0,0,0,1);

}

</style>
</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from 'https://esm.sh/globe.gl@2.32.0';

const world =
Globe()(document.getElementById('globeViz'))

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:170,
altitude:2.2

});

const labels = [

{
name:'東京',
lat:35.68,
lng:139.69
},

{
name:'ハワイ',
lat:21.30,
lng:-157.85
}

];

const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.getElementById(
'globeViz'
).appendChild(div);
labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const cam =
world.camera().position.clone().normalize();

labelEls.forEach(label=>{

const screen =
world.getScreenCoords(
label.lat,
label.lng
);

if(!screen){

label.el.style.display =
'none';

return;

}

const lat =
label.lat * Math.PI / 180;

const lng =
-label.lng * Math.PI / 180;

const phi =
(90 - label.lat) *
Math.PI / 180;

const theta =
(label.lng + 180) *
Math.PI / 180;

const x =
-Math.sin(phi) *
Math.cos(theta);

const y =
Math.cos(phi);

const z =
Math.sin(phi) *
Math.sin(theta);

const dot =

(x * cam.x) +
(y * cam.y) +
(z * cam.z);

if(dot < 0.15){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
screen.x + 'px';

label.el.style.top =
screen.y + 'px';

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(
'resize',
()=>{

world
.width(window.innerWidth)
.height(window.innerHeight);

}
);

</script>

</body>
</html>
