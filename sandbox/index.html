<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS Sandbox</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;

font-family:
Arial,
sans-serif;

}

#globeViz{

width:100vw;
height:100vh;

}

.city-label{

position:absolute;

color:white;

font-size:13px;

font-weight:500;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 5px rgba(120,220,255,0.75);

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe
from 'https://esm.sh/globe.gl';

import { events }
from '../data/events.js';

const world = Globe()(

document.getElementById(
'globeViz'

)

)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
'black'
);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

if(!event.relatedEvents) return;

event.relatedEvents.forEach(targetId=>{

const target =
events.find(
e=>e.id === targetId
);

if(!target) return;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:
event.lineColor
|| '#66e0ff'

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcAltitudeAutoScale(
0.22
)

.arcStroke(
0.12
)

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0);

const labelEls = [];

events.forEach(event=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
event.placeName;

document.body.appendChild(div);

labelEls.push({

el:div,

lat:event.lat,
lng:event.lng

});

});

function updateLabels(){

labelEls.forEach(label=>{

const screen =
world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const x =
screen.x;

const y =
screen.y;

const centerX =
window.innerWidth / 2;

const centerY =
window.innerHeight / 2;

const dx =
x - centerX;

const dy =
y - centerY;

const dist =
Math.sqrt(
dx * dx +
dy * dy
);

const radius =
Math.min(
centerX,
centerY
) * 0.92;

if(dist > radius){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
`${x}px`;

label.el.style.top =
`${y}px`;

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
