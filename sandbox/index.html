<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Sandbox Globe</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

.city-label{

position:absolute;

color:white;

font-size:14px;
font-weight:bold;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 10px rgba(0,0,0,1);

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from
'https://esm.sh/globe.gl@2.32.0';

const world =

Globe()(
document.getElementById(
'globeViz'
)
)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

import { events }
from '../data/events.js';

const labels =
events.map(event => ({

name:event.title,

lat:event.lat,
lng:event.lng,

year:event.year,

importance:event.importance,

relatedEvents:
event.relatedEvents

}));
const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(e=>e.id===id);

if(!target) return;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:[
'#00ffff',
'#ffff00'
]

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.7)

.arcDashLength(0.4)

.arcDashGap(0.2)

.arcDashAnimateTime(2500)

.arcAltitude(0.18);
const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.body
.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const camPos =

world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const pos =

world.getCoords(

label.lat,
label.lng,
0.02

);

const len = Math.sqrt(

(pos.x * pos.x) +

(pos.y * pos.y) +

(pos.z * pos.z)

);

const nx =
pos.x / len;

const ny =
pos.y / len;

const nz =
pos.z / len;

const dot =

(nx * camPos.x) +

(ny * camPos.y) +

(nz * camPos.z);

if(dot < 0.12){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
screen.x + 'px';

label.el.style.top =
screen.y + 'px';

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>
</html>
