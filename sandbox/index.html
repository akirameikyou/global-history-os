<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>History OS</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<div id="app">

  <!-- TOP BAR -->

  <header id="topBar">

    <div class="logoArea">

      <div class="appTitle">
        History OS
      </div>

      <div class="modeTitle">
        John Manjiro Mode
      </div>

    </div>

  </header>

  <!-- MAIN -->

  <main id="mainLayout">

    <!-- LEFT : WORLD -->

    <aside id="leftPanel">

      <section class="panelSection">

        <h2>WORLD EVENTS</h2>

        <div class="eventItem">
          <span class="year">1840</span>
          アヘン戦争
        </div>

        <div class="eventItem">
          <span class="year">1848</span>
          ゴールドラッシュ
        </div>

        <div class="eventItem">
          <span class="year">1853</span>
          ペリー来航
        </div>

        <div class="eventItem">
          <span class="year">1861</span>
          アメリカ南北戦争
        </div>

      </section>

    </aside>

    <!-- CENTER : GLOBE -->

    <section id="centerArea">

      <div id="globeViz"></div>

    </section>

    <!-- RIGHT : PERSON -->

    <aside id="rightPanel">

      <section class="panelSection">

        <h2>PERSON</h2>

        <h3>中浜万次郎</h3>

        <div class="timelineItem">
          <span class="year">1827</span>
          土佐清水周辺に生まれる
        </div>

        <div class="timelineItem">
          <span class="year">1841</span>
          漂流し鳥島へ漂着
        </div>

        <div class="timelineItem">
          <span class="year">1841</span>
          鳥島143日サバイバル
        </div>

        <div class="timelineItem">
          <span class="year">1842</span>
          ハワイへ
        </div>

        <div class="timelineItem">
          <span class="year">1843</span>
          アメリカ本土へ
        </div>

        <div class="timelineItem">
          <span class="year">1848</span>
          ゴールドラッシュ期
        </div>

        <div class="timelineItem">
          <span class="year">1851</span>
          琉球へ帰着
        </div>

        <div class="timelineItem">
          <span class="year">1860</span>
          咸臨丸で再渡米
        </div>

        <div class="timelineItem">
          <span class="year">1898</span>
          東京で死去
        </div>

      </section>

    </aside>

  </main>

  <!-- BOTTOM TIMELINE -->

  <footer id="bottomTimeline">

    <div id="timelineTrack">

      <div class="century">1600</div>

      <div class="century">1700</div>

      <div class="century activeCentury">
        1800
      </div>

      <div class="century">1900</div>

      <div class="century">2000</div>

    </div>

  </footer>

</div>

<script type="module" src="./main.js"></script>

</body>

</html>
