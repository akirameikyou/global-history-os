<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Arial,sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

.city-label{

position:absolute;

color:white;

font-size:13px;
font-weight:500;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 5px rgba(120,220,255,0.7);

transition:0.25s;

}

#historyTitle{

position:absolute;

top:18px;
left:50%;

transform:
translateX(-50%);

color:white;

font-size:15px;

letter-spacing:3px;

opacity:0.55;

z-index:10;

pointer-events:none;

}

#leftPanel{

position:absolute;

left:0;
top:0;

width:260px;
height:100vh;

padding:24px;

box-sizing:border-box;

background:
linear-gradient(
90deg,
rgba(0,0,0,0.72),
rgba(0,0,0,0.18),
transparent
);

backdrop-filter:
blur(10px);

z-index:5;

color:white;

}

.panelHeader{

font-size:12px;

letter-spacing:2px;

opacity:0.45;

margin-bottom:18px;

}

.eventItem{

padding:10px 0;

border-bottom:
1px solid rgba(255,255,255,0.06);

cursor:pointer;

transition:0.2s;

}

.eventItem:hover{

opacity:1;

transform:
translateX(4px);

}

.eventYear{

font-size:11px;

color:#66e0ff;

margin-bottom:4px;

}

.eventTitle{

font-size:14px;

font-weight:600;

}

#rightPanel{

position:absolute;

right:0;
top:0;

width:320px;
height:100vh;

padding:28px;

box-sizing:border-box;

background:
linear-gradient(
-90deg,
rgba(0,0,0,0.72),
rgba(0,0,0,0.18),
transparent
);

backdrop-filter:
blur(10px);

z-index:5;

color:white;

}

#detailName{

font-size:32px;
font-weight:700;

margin-bottom:8px;

}

#detailYears{

font-size:13px;

color:#66e0ff;

margin-bottom:20px;

}

#detailText{

font-size:14px;

line-height:1.8;

color:
rgba(255,255,255,0.78);

margin-bottom:28px;

}

#detailTimeline{

border-top:
1px solid rgba(255,255,255,0.08);

padding-top:18px;

}

.timelineItem{

margin-bottom:14px;

}

.timelineYear{

font-size:11px;

color:#66e0ff;

margin-bottom:4px;

}

.timelineText{

font-size:14px;

}

</style>

</head>

<body>

<div id="globeViz"></div>

<div id="historyTitle">
HISTORY OS
</div>

<div id="leftPanel">

<div class="panelHeader">
WORLD EVENTS
</div>

<div id="eventList"></div>

</div>

<div id="rightPanel">

<div id="detailName">
John Manjiro
</div>

<div id="detailYears">
1827 - 1898
</div>

<div id="detailText">
Japanese fisherman and historical bridge between Edo Japan and the United States during the final years of isolation.
</div>

<div id="detailTimeline"></div>

</div>

<script type="module">

import Globe
from 'https://esm.sh/globe.gl@2.32.0';

import { events }
from '../data/events.js';

const world = Globe()(

document.getElementById(
'globeViz'

)

)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor(
'black'
)

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:160,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(
e=>e.id===id
);

if(!target) return;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:
event.lineColor
|| '#66e0ff'

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.06)

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0)

.arcAltitudeAutoScale(0.18);

const labels = [];

events.forEach(event=>{

const alreadyExists =
labels.find(
l=>l.name===event.placeName
);

if(alreadyExists) return;

labels.push({

name:event.placeName,

lat:event.lat,
lng:event.lng

});

});

const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.body.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const camPos =

world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const pos =

world.getCoords(

label.lat,
label.lng,
0.02

);

const len = Math.sqrt(

(pos.x * pos.x) +

(pos.y * pos.y) +

(pos.z * pos.z)

);

const nx = pos.x / len;
const ny = pos.y / len;
const nz = pos.z / len;

const dot =

(nx * camPos.x) +

(ny * camPos.y) +

(nz * camPos.z);

if(dot < 0.22){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
`${screen.x}px`;

label.el.style.top =
`${screen.y}px`;

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

const eventList =
document.getElementById(
'eventList'
);

const detailTimeline =
document.getElementById(
'detailTimeline'
);

events.forEach(event=>{

const item =
document.createElement('div');

item.className =
'eventItem';

item.innerHTML =

`
<div class="eventYear">
${event.year}
</div>

<div class="eventTitle">
${event.title}
</div>
`;

item.onclick = ()=>{

world.pointOfView({

lat:event.lat,
lng:event.lng,
altitude:1.2

},
1200

);

};

eventList.appendChild(item);

const timeline =
document.createElement('div');

timeline.className =
'timelineItem';

timeline.innerHTML =

`
<div class="timelineYear">
${event.year}
</div>

<div class="timelineText">
${event.title}
</div>
`;

detailTimeline.appendChild(
timeline
);

});

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
