<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

.city-label{

position:absolute;

color:white;

font-size:13px;
font-weight:500;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

text-shadow:
0 0 5px rgba(0,255,255,0.7);

}

#leftPanel{

position:absolute;

left:0;
top:0;

width:320px;
height:100vh;

background:
rgba(0,0,0,0.72);

backdrop-filter:
blur(12px);

border-right:
1px solid rgba(255,255,255,0.08);

padding:24px;

box-sizing:border-box;

color:white;

overflow-y:auto;

z-index:10;

}

.panel-title{

font-size:28px;
font-weight:700;

margin-bottom:8px;

}

.panel-sub{

font-size:13px;

color:
rgba(255,255,255,0.55);

margin-bottom:28px;

}

.event-card{

padding:14px;

margin-bottom:14px;

border:
1px solid rgba(255,255,255,0.08);

border-radius:14px;

background:
rgba(255,255,255,0.04);

transition:0.25s;

cursor:pointer;

}

.event-card:hover{

background:
rgba(0,255,255,0.08);

border:
1px solid rgba(0,255,255,0.3);

}

.event-year{

font-size:12px;

color:#66e0ff;

margin-bottom:6px;

}

.event-title{

font-size:17px;
font-weight:600;

margin-bottom:6px;

}

.event-place{

font-size:13px;

color:
rgba(255,255,255,0.6);

}

</style>

</head>

<body>

<div id="globeViz"></div>

<div id="leftPanel">

<div class="panel-title">
History OS
</div>

<div class="panel-sub">
Civilization Meaning Interface
</div>

<div id="eventList"></div>

</div>

<script type="module">

import Globe from
'https://esm.sh/globe.gl@2.32.0';

import { events }
from '../data/events.js';

const world =

Globe()(
document.getElementById(
'globeViz'
)
)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(e=>e.id===id);

if(!target) return;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:'#66e0ff'

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.12)

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0)

.arcAltitudeAutoScale(0.22);

const labels =
events.map(event => ({

name:event.placeName,

lat:event.lat,
lng:event.lng

}));

const labelEls = [];

labels.forEach(label=>{

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
label.name;

document.body
.appendChild(div);

labelEls.push({

el:div,

lat:label.lat,
lng:label.lng

});

});

function updateLabels(){

const camPos =

world.camera()
.position
.clone()
.normalize();

labelEls.forEach(label=>{

const screen =

world.getScreenCoords(

label.lat,
label.lng

);

if(!screen){

label.el.style.display =
'none';

return;

}

const pos =

world.getCoords(

label.lat,
label.lng,
0.02

);

const len = Math.sqrt(

(pos.x * pos.x) +

(pos.y * pos.y) +

(pos.z * pos.z)

);

const nx =
pos.x / len;

const ny =
pos.y / len;

const nz =
pos.z / len;

const dot =

(nx * camPos.x) +

(ny * camPos.y) +

(nz * camPos.z);

if(dot < 0.12){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
screen.x + 'px';

label.el.style.top =
screen.y + 'px';

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

const eventList =
document.getElementById(
'eventList'
);

events.forEach(event=>{

const card =
document.createElement('div');

card.className =
'event-card';

card.innerHTML =

`
<div class="event-year">
${event.year}
</div>

<div class="event-title">
${event.title}
</div>

<div class="event-place">
${event.placeName}
</div>
`;

card.onclick = ()=>{

world.pointOfView({

lat:event.lat,
lng:event.lng,
altitude:1.2

},
1200

);

};

eventList.appendChild(card);

});

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
