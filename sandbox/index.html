<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>History OS</title>

<style>

html,
body{

margin:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:sans-serif;

}

#globeViz{

position:absolute;
inset:0;

}

.city-label{

position:absolute;

color:white;

font-size:10px;
font-weight:400;

pointer-events:none;

white-space:nowrap;

transform:
translate(-50%,-50%);

letter-spacing:0.5px;

text-shadow:
0 0 6px rgba(0,255,255,0.65);

opacity:0.92;

}

</style>

</head>

<body>

<div id="globeViz"></div>

<script type="module">

import Globe from
'https://esm.sh/globe.gl@2.32.0';

import { events }
from '../data/events.js';

const world =

Globe()(
document.getElementById(
'globeViz'
)
)

.globeImageUrl(
'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
)

.backgroundColor('black')

.width(window.innerWidth)

.height(window.innerHeight);

world.pointOfView({

lat:30,
lng:140,
altitude:2.2

});

const arcs = [];

events.forEach(event=>{

event.relatedEvents.forEach(id=>{

const target =
events.find(e=>e.id===id);

if(!target) return;

const dx =
event.lat - target.lat;

const dy =
event.lng - target.lng;

const dist = Math.sqrt(
(dx * dx) +
(dy * dy)
);

let altitude =
dist * 0.0035;

if(altitude < 0.03)
altitude = 0.03;

if(altitude > 0.22)
altitude = 0.22;

arcs.push({

startLat:event.lat,
startLng:event.lng,

endLat:target.lat,
endLng:target.lng,

color:event.lineColor,

altitude

});

});

});

world.arcsData(arcs)

.arcColor('color')

.arcStroke(0.12)

.arcAltitude('altitude')

.arcDashLength(1)

.arcDashGap(0)

.arcDashAnimateTime(0);

const labelEls = [];

events.forEach(event => {

const div =
document.createElement('div');

div.className =
'city-label';

div.innerText =
event.placeName;

document.body.appendChild(div);

labelEls.push({

el:div,

lat:event.lat,
lng:event.lng,

event

});

});

const COUNTRY_ZOOM = 2.4;
const CITY_ZOOM = 1.8;

function getZoomLevel(){

const altitude =
world.pointOfView().altitude;

if(altitude > COUNTRY_ZOOM){

return 'country';

}

if(altitude > CITY_ZOOM){

return 'city';

}

return 'event';

}

function updateLabels(){

const zoomLevel =
getZoomLevel();

labelEls.forEach(label => {

const screen =
world.getScreenCoords(
label.lat,
label.lng
);

if(!screen){

label.el.style.display =
'none';

return;

}

const x =
screen.x;

const y =
screen.y;

const centerX =
window.innerWidth / 2;

const centerY =
window.innerHeight / 2;

const dx =
x - centerX;

const dy =
y - centerY;

const dist =
Math.sqrt(dx * dx + dy * dy);

const radius =
Math.min(centerX, centerY) * 0.92;

if(dist > radius){

label.el.style.display =
'none';

return;

}

if(

zoomLevel === 'country'
&&
label.event.layer !== 'country'

){

label.el.style.display =
'none';

return;

}

if(

zoomLevel === 'city'
&&
label.event.layer === 'event'

){

label.el.style.display =
'none';

return;

}

label.el.style.display =
'block';

label.el.style.left =
`${x}px`;

label.el.style.top =
`${y}px`;

});

requestAnimationFrame(
updateLabels
);

}

updateLabels();

window.addEventListener(

'resize',

()=>{

world

.width(window.innerWidth)

.height(window.innerHeight);

}

);

</script>

</body>

</html>
