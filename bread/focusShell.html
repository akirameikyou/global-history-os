<!doctype html>
<!-- bread/focusShell.html: 小麦とパン Focus — History OS（主題型の Focus。骨組み M1-0）。
     万次郎・北斎・合氣道の Focus と同じ見た目の言葉（全面の地球・上中央の題・左右の浮遊パネル・中央下の年代バー・浮遊カード）。
     主題型の決まりごと（bread-focus-001 の COMPOSITION／DECISIONS／DATA_SPEC）：
       ・年代バーは章ごとに目盛りが違う。各章の帯に「1目盛り＝○年」を常に出す（光源＝いまの縮尺が見えること）
       ・光源レンズ6つは観測者が動かす。押すとその構造だけが光り、他は影に沈む
       ・確かさ3段：確定（塗り）／幅（輪）／語り（破線）。未確認は載せない
       ・カードは二段：台所の段（最初）／研究の段（開くと：学問・証拠・出典）
       ・系統パネル：パン小麦から遡る。Bゲノムの供与種は未発見＝空白のノード
     原則：年カーソル ≠ 年代バーの表示幅 ≠ カメラ。カメラは「地点を見る」「遡る」を押した時だけ動く。 -->
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History OS｜小麦とパン Focus</title>
<meta name="description" content="野の草から一枚のパンまで。小麦の系統、栽培化、製粉、発酵、世界と日本のパンの歴史を、地球と年代バーでたどる History OS の小麦とパン Focus（個人制作）。">
<style>
  :root{
    --wheat:#e8c27a; --wheat-soft:#f3dcae;
    --cyan:#66e0ff; --cyan-soft:#9becff;
    --est:#e0b45f;
    --bg:#050c16;
    --panel:rgba(7,14,24,.62);
    --rule:rgba(255,255,255,.09);
    --ink:#eef3f8; --sub:#9db4c8; --dim:rgba(238,243,248,.42);
    --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho",serif; --mono:"SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #globeViz{position:fixed;inset:0;z-index:1}
  .glabel{pointer-events:none;white-space:nowrap;font-family:var(--sans);font-weight:700;letter-spacing:.04em;
    transform:translate(-50%,-140%);text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.85)}
  .glabel.dot::after{content:'';position:absolute;left:50%;top:135%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
  [hidden]{display:none!important}
  button{font-family:inherit}

  .title{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
  .title h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.5em;text-indent:.5em}
  .title p{margin:7px 0 0;font-size:10.5px;letter-spacing:.42em;color:var(--wheat-soft)}
  .attrib{position:absolute;right:24px;bottom:8px;z-index:12;font-size:9.5px;color:var(--dim);text-align:right}

  .panel{position:absolute;z-index:20;border:1px solid var(--rule);background:var(--panel);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-radius:5px;overflow:auto}
  /* 送りのバー：背景（地・白い矢印ボタン）を付けない（OSシリーズの画面の規律）。どの枠・カードにも同じものを効かせる */
  ::-webkit-scrollbar{width:6px;height:6px;background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(232,194,122,.28);border-radius:3px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  .sec{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding:13px 16px 6px}
  .sec .secsub{text-transform:none;letter-spacing:.06em;margin-left:8px;font-size:9.5px}

  /* ── 左：光源レンズ・層・系統 ── */
  .left-col{position:absolute;left:24px;top:96px;width:280px;z-index:20;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 300px)}
  .left-col>.panel{position:relative;left:auto;top:auto}
  .lenses{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
  .lens{display:inline-flex;align-items:center;gap:6px;background:rgba(7,14,24,.55);border:1px solid var(--lc);color:var(--ink);border-radius:4px;padding:3px 9px;font-size:11.5px;cursor:pointer}
  .lens::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--lc)}
  .lens.dim{opacity:.38;border-style:dashed}
  .lens.on{box-shadow:0 0 0 1px var(--lc) inset;background:rgba(255,255,255,.08);font-weight:700}
  .lens-all{border-color:rgba(238,243,248,.35)} .lens-all::before{background:linear-gradient(90deg,#8fd17a,#e8c27a,#d98ee0,#66c6ff)}
  .lens-note{padding:0 16px 12px;font-size:10px;color:var(--dim);line-height:1.6}
  .layers{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
  .tgl{background:rgba(7,14,24,.55);border:1px solid rgba(238,243,248,.25);color:var(--sub);border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer}
  .tgl[aria-pressed="true"]{color:var(--ink);border-color:var(--wheat);background:rgba(232,194,122,.12)}
  #lineageSvg{display:block;width:100%;height:auto;padding:0 6px}
  .lin-node{cursor:pointer}
  .lin-node text{font-size:9.5px;fill:var(--ink)}
  .lin-node .g{font-family:var(--mono);font-size:8.5px;fill:var(--wheat-soft)}
  .lin-node.unknown rect{stroke-dasharray:3 3}
  .lin-node.sel rect{stroke:var(--wheat);stroke-width:2}
  .lin-node.trace rect{fill:rgba(232,194,122,.22)}
  .lin-foot{display:flex;gap:6px;align-items:center;padding:6px 14px 12px}
  .lin-foot .hint{font-size:10px;color:var(--dim);line-height:1.5}

  /* ── 右：一覧とカード ── */
  .right-panel{right:24px;top:96px;width:360px;max-height:calc(100% - 300px);display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--rule);flex:0 0 auto}
  .tab{flex:1 1 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--sub);font-size:11.5px;padding:6px 4px 7px;cursor:pointer}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--wheat)}
  .scroll{overflow:auto;flex:1 1 auto;min-height:0}
  .chap-head{padding:12px 16px 4px}
  .chap-head .n{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.08em}
  .chap-head .s{font-size:10.5px;color:var(--sub);margin-top:2px}
  .item{padding:8px 16px 9px;border-bottom:1px solid var(--rule);cursor:pointer;border-left:2px solid transparent}
  .item:hover{background:rgba(255,255,255,.05)}
  .item.sel{background:rgba(232,194,122,.10);border-left-color:var(--wheat)}
  .item.shade{opacity:.35}
  .item.future{opacity:.38}
  .item.now{box-shadow:inset 2px 0 0 var(--wheat-soft)}
  .item .y{font-family:var(--mono);font-size:10.5px;color:var(--wheat-soft)}
  .item .t{font-size:12.5px;line-height:1.5;margin-top:1px}
  .conf{display:inline-block;font-size:9px;border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px;border:1px solid currentColor;line-height:1.5}
  .conf.confirmed{color:#cfe8d0} .conf.range{color:var(--est);border-style:dashed}
  .conf.narrative{color:#d8b4f0;border-style:dotted}
  .chip{display:inline-block;font-size:9.5px;border:1px solid var(--lc,rgba(238,243,248,.3));color:var(--lc,var(--sub));border-radius:3px;padding:0 5px;margin:2px 4px 0 0;line-height:1.55}
  .fld{display:inline-block;font-size:9.5px;color:var(--sub);background:rgba(255,255,255,.06);border-radius:3px;padding:0 5px;margin:2px 4px 0 0;line-height:1.6}
  .empty{padding:12px 16px;font-size:11px;color:var(--dim);line-height:1.6}
  .lv{padding:10px 16px;border-bottom:1px solid var(--rule)}
  .lv .nm{font-family:var(--serif);font-size:14.5px;font-weight:700}
  .lv .lvl{font-size:9px;color:var(--dim);margin-left:6px;border:1px solid rgba(238,243,248,.25);border-radius:3px;padding:0 4px}
  .lv p{margin:5px 0 0;font-size:11.5px;line-height:1.65;color:rgba(238,243,248,.86)}
  .lv .org{font-size:10px;color:var(--sub);margin-top:4px}
  .lv a,.dcard a{color:var(--cyan-soft)}
  .chk{padding:10px 16px;border-bottom:1px solid var(--rule)}
  .chk .q{font-size:12px;font-weight:700;line-height:1.55}
  .chk p{margin:5px 0 0;font-size:11.5px;line-height:1.65;color:rgba(238,243,248,.86)}
  .chk .refs{margin-top:4px}
  .ref{font-size:10px;color:var(--cyan-soft);cursor:pointer;margin-right:8px;border-bottom:1px dotted rgba(155,236,255,.5)}

  /* ── 上右：ボタン ── */
  #topCtl{position:absolute;right:24px;top:58px;z-index:22;display:flex;gap:6px}

  /* ── 下：年代バー ── */
  #timelineBar{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:20;width:min(1100px,calc(100vw - 48px));
    background:var(--panel);border:1px solid var(--rule);border-radius:5px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);padding:10px 12px 8px}
  .tl-top{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  #tlYear{font-family:var(--serif);font-size:26px;color:var(--wheat-soft);letter-spacing:.03em;line-height:1;white-space:nowrap;min-width:150px}
  .tl-btns{display:flex;gap:4px}
  .zb{background:rgba(7,14,24,.7);border:1px solid var(--rule);color:var(--ink);border-radius:6px;width:28px;height:26px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .zb:hover{border-color:rgba(232,194,122,.6)} .zb.play[aria-pressed="true"]{color:var(--wheat);border-color:var(--wheat)}
  .tl-mid{min-width:0}
  #tlChap{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tlScale{font-size:10px;color:var(--wheat-soft);margin-top:2px}
  .tl-hint{margin-left:auto;font-size:9.5px;color:var(--dim);max-width:220px;line-height:1.5}
  #tl{display:block;width:100%;height:118px;cursor:ew-resize;touch-action:none}
  #tl .sname{cursor:pointer}
  #tl .cur-line{stroke:var(--wheat);stroke-width:1.5}
  #tl .cur-head{fill:var(--wheat)}
  #tl .past{opacity:.45}
  #tl .future{opacity:.16}
  /* ── 地球の印（HTML）：波紋は使わない。点＝地点がはっきり／淡い破線の輪＝このあたり ── */
  .gm{position:relative;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);border-radius:50%}
  .gm.site{width:9px;height:9px;background:var(--c);box-shadow:0 0 0 1.5px rgba(5,12,22,.85)}
  .glabel{z-index:3}
  .gm.site.range{background:rgba(5,12,22,.85);border:1.8px solid var(--c);width:10px;height:10px}
  .gm.site.narrative{background:rgba(5,12,22,.85);border:1.8px dashed var(--c);width:10px;height:10px}
  .gm.region{width:34px;height:34px;border:1.2px dashed var(--c);background:rgba(232,194,122,.06)}
  .gm.region::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--c)}
  .gm.past{opacity:.42} .gm.past.region{width:14px;height:14px;border-style:solid;background:transparent}
  .gm.past.region::after{display:none}
  .gm.now{z-index:2} .gm.now.site{width:13px;height:13px}
  .gm.sel{box-shadow:0 0 0 2px #fff,0 0 12px rgba(255,255,255,.6)}
  .gm.shade{opacity:.12}
  .gm.wild{width:8px;height:8px;background:#8fd17a;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 1px rgba(5,12,22,.8)}
  #tl .seg rect.bg{fill:rgba(255,255,255,.025)}
  #tl .seg.cur rect.bg{fill:rgba(232,194,122,.08)}
  #tl .seg:hover rect.bg{fill:rgba(255,255,255,.06)}
  #tl .sname{font-size:10.5px;fill:var(--ink);font-family:var(--serif);font-weight:700}
  #tl .sscale{font-size:8.5px;fill:var(--wheat-soft)}
  #tl .tick{stroke:rgba(238,243,248,.22)}
  #tl .tlab{font-size:8px;fill:var(--dim);font-family:var(--mono)}
  #tl .mk{cursor:pointer}
  #tl .lane{font-size:8px;fill:var(--dim)}
  .legend{position:absolute;left:24px;bottom:6px;z-index:20;font-size:9.5px;color:var(--sub);display:flex;gap:14px;white-space:nowrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

  /* ── 浮遊カード（出来事・系統ノード）── */
  .dcard{position:absolute;z-index:30;right:400px;top:96px;width:380px;max-height:calc(100% - 300px);overflow:auto;
    background:rgba(6,12,21,.86);border:1px solid rgba(232,194,122,.35);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  /* カードの上端の帯：つかんで動かす・✕で閉じる。中を送っても帯は上に残る（画像に✕が隠れないように） */
  .dc-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 12px;
    background:rgba(6,12,21,.92);border-bottom:1px solid var(--rule);cursor:grab;user-select:none;touch-action:none}
  .dc-bar:active{cursor:grabbing}
  .dc-grip{font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .dc-x{margin-left:auto;background:transparent;border:0;color:var(--sub);font-size:15px;line-height:1;padding:4px 6px;cursor:pointer}
  .dc-x:hover{color:var(--ink)}
  .dcard.moved{right:auto}
  .dc-head{padding:14px 18px 8px;border-bottom:1px solid var(--rule)}
  .dc-when{font-family:var(--mono);font-size:11px;color:var(--wheat-soft)}
  .dc-title{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.35;margin-top:3px;padding-right:18px}
  .dc-place{font-size:10.5px;color:var(--sub);margin-top:4px}
  .dc-body{padding:10px 18px 14px}
  .kitchen{font-size:13px;line-height:1.85;margin:2px 0 10px}
  .cross{font-size:11.5px;line-height:1.65;color:#d9c9ff;border-left:2px solid #c79bff;padding:4px 0 4px 10px;margin:0 0 10px}
  details.research{border-top:1px solid var(--rule);padding-top:8px}
  details.research>summary{cursor:pointer;font-size:11px;letter-spacing:.12em;color:var(--wheat-soft);list-style:none}
  details.research>summary::-webkit-details-marker{display:none}
  .rs{margin-top:8px}
  .rs h4{margin:10px 0 3px;font-size:9.5px;letter-spacing:.16em;color:var(--dim);font-weight:400}
  .rs p{margin:0;font-size:11.5px;line-height:1.7;color:rgba(238,243,248,.88)}
  .rs ul{margin:0;padding-left:16px;font-size:11px;line-height:1.6}
  .rs .note{font-size:10px;color:var(--est);margin-top:8px;line-height:1.55}
  /* 画像：実物は右下に作者・ライセンス。生成画像は必ず左上に「◇ 想像図」の印（実物と見分けるための決まった印） */
  .dc-fig{margin:0;position:relative;border-bottom:1px solid var(--rule);background:#03070d}
  .dc-fig img{display:block;width:100%;max-height:230px;object-fit:contain}
  .dc-fig figcaption{padding:6px 18px 8px;font-size:10px;color:var(--sub);line-height:1.55}
  .dc-fig figcaption a{color:var(--cyan-soft)}
  .gen-mark{position:absolute;left:8px;top:8px;font-size:10px;letter-spacing:.08em;color:#1b1206;background:#f3dcae;border-radius:3px;padding:1px 6px;font-weight:700}
  .gen-mark::before{content:'◇ '}
  .dc-fig.gen figcaption{color:#f3dcae}
  .genlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
  .genlist figure{margin:0;position:relative;cursor:pointer}
  .genlist img{width:100%;height:64px;object-fit:cover;border-radius:3px;display:block}
  .genlist figcaption{font-size:9.5px;color:var(--sub);line-height:1.4;margin-top:3px}
  .genlist .gen-mark{left:3px;top:3px;font-size:8.5px;padding:0 4px}
  .dc-act{margin:0 18px 14px;background:transparent;border:1px solid rgba(232,194,122,.5);color:var(--wheat-soft);border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer}

  @media (max-width:980px){
    .dcard{right:24px;left:24px;width:auto}
    .left-col{width:230px}
    .right-panel{width:300px}
  }
  @media (max-width:760px){
    .title h1{font-size:18px;letter-spacing:.3em}
    .left-col{top:auto;bottom:206px;left:12px;right:12px;width:auto;max-height:30vh;overflow:auto}
    .left-col #linPanel{display:none}
    .right-panel{top:72px;right:12px;left:12px;width:auto;max-height:26vh}
    #topCtl{top:44px;right:12px}
    #timelineBar{bottom:24px;width:calc(100vw - 24px)}
    .dcard{top:72px;left:12px;right:12px;max-height:calc(100% - 300px)}
    .legend{display:none}
  }
</style>
</head><body>
<div id="globeViz"></div>
<div class="title"><h1>小麦とパン</h1><p>WHEAT &amp; BREAD FOCUS</p></div>
<div class="attrib">地球: NASA Blue Marble ／ 個人制作 ／ 骨組み M1-0（データは出典調査の下書き）</div>

<div id="topCtl">
  <button class="tgl" id="infoBtn" type="button">出典・この Focus について</button>
</div>

<div class="left-col" id="leftCol">
  <div class="panel" id="lensPanel">
    <div class="sec">光源<span class="secsub">どの構造を照らすか</span></div>
    <div class="lenses" id="lenses"></div>
    <div class="lens-note" id="lensNote">いまは全体を正面から照らしています。レンズを押すと、その構造の出来事だけが光ります。</div>
    <div class="sec" style="padding-top:2px">層<span class="secsub">地球に重ねる</span></div>
    <div class="layers">
      <button class="tgl" id="wildBtn" type="button" aria-pressed="false">野生種の自生域</button>
      <button class="tgl" id="gridBtn" type="button" aria-pressed="false">緯度経度の網</button>
    </div>
  </div>
  <div class="panel" id="linPanel">
    <div class="sec">系統<span class="secsub">パン小麦のなりたち</span></div>
    <svg id="lineageSvg" viewBox="0 0 268 202"></svg>
    <div class="lin-foot">
      <button class="tgl" id="traceBtn" type="button">遡る ▸</button>
      <span class="hint" id="traceHint">いまのパン小麦から、野の草へ一段ずつ遡ります。</span>
    </div>
  </div>
</div>

<div class="panel right-panel" id="rightPanel">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="events" aria-selected="true">年表</button>
    <button class="tab" role="tab" data-tab="leavens" aria-selected="false">パン種</button>
    <button class="tab" role="tab" data-tab="narr" aria-selected="false">語り</button>
    <button class="tab" role="tab" data-tab="check" aria-selected="false">確かめる</button>
  </div>
  <div class="scroll" id="rpBody"></div>
</div>

<div id="detailCard" class="dcard" hidden>
  <div class="dc-bar" id="dcBar" title="つかんで動かせます（二度押しで元の位置へ）"><span class="dc-grip">⠿ つかんで動かす</span><button class="dc-x" id="dcClose" type="button" aria-label="閉じる">✕</button></div>
  <div id="dcFig"></div>
  <div class="dc-head"><div class="dc-when" id="dcWhen"></div><div class="dc-title" id="dcTitle"></div><div class="dc-place" id="dcPlace"></div></div>
  <div class="dc-body" id="dcBody"></div>
  <button class="dc-act" id="dcAct" type="button" hidden>地点を見る</button>
</div>

<div id="timelineBar">
  <div class="tl-top">
    <div id="tlYear">—</div>
    <div class="tl-btns">
      <button class="zb" id="prevE" type="button" title="前の出来事へ" aria-label="前の出来事へ">‹</button>
      <button class="zb play" id="playBtn" type="button" title="再生：出来事を一つずつたどる" aria-label="再生">▶</button>
      <button class="zb" id="nextE" type="button" title="次の出来事へ" aria-label="次の出来事へ">›</button>
    </div>
    <div class="tl-mid"><div id="tlChap">全体</div><div id="tlScale"></div></div>
    <div class="tl-hint">バーを左右になぞると時代が展開します。章の名を押すとその章を広げます。</div>
  </div>
  <svg id="tl"></svg>
</div>
<div class="legend">
  <span><i style="background:#e8c27a"></i>確定</span>
  <span><i style="border:1.5px solid #e0b45f"></i>幅（学説が割れる・推定）</span>
  <span><i style="border:1.5px dashed #d8b4f0"></i>語り</span>
  <span>▲草の時計　■畑の時計　●パンの時計</span>
  <span>◇ 想像図＝生成画像（実物の写真ではない）</span>
</div>

<script type="module">
import Globe from 'https://esm.sh/globe.gl@2.46.2?deps=three-globe@2.45.2'; // 他の Focus と同じ固定版
import { breadEvents as EVENTS, breadChecks as CHECKS } from '../data/bread_events.js?v=20261115a';
import { breadLineageNodes as NODES, breadLineageCross as CROSS } from '../data/bread_lineage.js?v=20261115a';
import { breadAttributions as ATTR, breadLeavens as LEAVENS } from '../data/bread_food.js?v=20261115a';
import { breadChapters as CHAPTERS, breadLenses as LENSES, breadFields as FIELDS } from '../data/bread_config.js?v=20261115a';
import { breadImages as IMAGES } from '../data/bread_images.js?v=20261115c';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LENS = Object.fromEntries(LENSES.map(l => [l.id, l]));
const CONF_JA = { confirmed: '確定', range: '幅', narrative: '語り' };
const KIND_JA = { peer_reviewed: '査読論文', primary: '一次資料', institution: '研究機関・公的機関', book: '書籍', press: '報道', secondary: '二次資料' };
const CLOCK_JA = { grass: '草の時計', field: '畑の時計', bread: 'パンの時計' };
const S = { chapter: null, lens: null, sel: null, tab: 'events', wild: false, grid: false, trace: -1, node: null, year: -12400, playing: false };

/* ── 年の書き方 ── */
function yr(y) { return y < 0 ? `前${Math.abs(Math.round(y)).toLocaleString()}` : `${Math.round(y)}`; }
function whenText(e) { return e.when.label || (e.when.from === e.when.to ? yr(e.when.from) : `${yr(e.when.from)}〜${yr(e.when.to)}`); }

/* ── 地球 ── */
const world = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe@2.45.2/example/img/earth-blue-marble.jpg')
  .backgroundColor('#050c16')
  .atmosphereColor('#e8c27a').atmosphereAltitude(0.16)
  .pathPoints(d => d.pts).pathPointLat(p => p[0]).pathPointLng(p => p[1])
  .pathColor(d => d.color).pathStroke(d => d.w).pathDashLength(d => d.dash || 1).pathDashGap(d => d.gap || 0).pathTransitionDuration(0)
  // 印と地名はすべて HTML で出す。
  //  ・地名：labelsData の字形は英字のみで日本語が「?」になるため（万次郎版と同じ方式）
  //  ・印：波紋（ringsData）は「そこから広がった」ように見え、広がりのデータがないのに伝播を思わせるのでやめた。
  //    地点がはっきりしているもの＝小さな点、地域の代表点＝淡い破線の輪（動かない）。確かさは塗り／輪／破線（年代バーと同じ）
  .htmlLat(d => d.lat).htmlLng(d => d.lng).htmlAltitude(d => d.alt ?? 0.012).htmlElement(d => {
    const el = document.createElement('div');
    if (d.kind === 'label') {
      el.className = 'glabel'; el.textContent = d.text;
      el.style.color = d.color; el.style.fontSize = `${Math.round(10 + d.size * 6)}px`;
      return el;
    }
    el.className = d.cls; el.style.setProperty('--c', d.color); el.title = d.title;
    el.addEventListener('click', ev => { ev.stopPropagation(); d.onClick && d.onClick(); });
    return el;
  });
world.pointOfView({ lat: 34, lng: 42, altitude: 2.3 }, 0); // 肥沃な三日月地帯を正面に
// 地球の準備が終わる前に HTML の印を渡すと three-globe の isBehindGlobe が落ちる（万次郎版と同じく準備完了を待つ）
let globeReady = false;
const markGlobeReady = () => { if (globeReady) return; globeReady = true; drawGlobe(); };
world.onGlobeReady(markGlobeReady);
// 予備：準備の合図が来なくても、描画が進み始めたら置く（万次郎版と同じ）
setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(markGlobeReady)), 1000);
world.controls().autoRotate = false;

function lensColor(e) {
  if (S.lens) return LENS[S.lens].color;
  return e.confidence === 'narrative' ? '#d8b4f0' : (e.confidence === 'range' ? '#e0b45f' : '#e8c27a');
}
function lensOn(e) { return !S.lens || e.lenses.includes(S.lens); }
/* 時間との関係：future＝カーソルより後（出さない）／now＝カーソルが出来事の幅の中か、直前の一目盛り以内／past＝それより前 */
function timeState(e) {
  if (e.when.from > S.year) return 'future';
  const c = CHAPTERS.find(c => c.id === chapterAt(S.year));
  return S.year <= e.when.to + c.tick ? 'now' : 'past';
}
function lit(e) { return lensOn(e) && timeState(e) !== 'future'; }
function drawGlobe() {
  const html = [], paths = [];
  for (const e of EVENTS) {
    if (e.place.lat == null) continue;
    const ts = timeState(e), sel = S.sel === e.id;
    if (ts === 'future' && !sel) continue;
    const cls = ['gm', e.place.precision === 'region' ? 'region' : 'site', e.confidence, ts, sel ? 'sel' : '', lensOn(e) ? '' : 'shade'].join(' ');
    html.push({ lat: e.place.lat, lng: e.place.lng, cls, color: lensColor(e), title: `${e.title_ja}（${whenText(e)}）`, onClick: () => select(e.id) });
    if (sel || (ts === 'now' && lensOn(e) && S.playing)) html.push({ kind: 'label', lat: e.place.lat, lng: e.place.lng, alt: 0.02, text: e.title_ja, size: 0.7, color: '#ffffff' });
  }
  if (S.wild) {
    for (const n of NODES) {
      if (n.lat == null) continue;
      const tr = traceIds().includes(n.id), sel = S.node === n.id;
      html.push({ lat: n.lat, lng: n.lng, cls: 'gm wild', color: '#8fd17a', title: n.name, onClick: () => openNode(n.id, false) });
      html.push({ kind: 'label', lat: n.lat, lng: n.lng, alt: 0.02, text: `${shortName(n)}（${n.genome}）`, size: sel || tr ? 0.7 : 0.45,
        color: sel || tr ? '#c8f0b0' : 'rgba(143,209,122,0.9)' });
    }
  }
  const labels = html; // 赤道の文字も同じ列へ
  if (S.grid) {
    for (let la = -60; la <= 60; la += 15) {
      const p = []; for (let lo = -180; lo <= 180; lo += 4) p.push([la, lo]);
      paths.push({ pts: p, color: la === 0 ? 'rgba(232,194,122,0.85)' : 'rgba(238,246,248,0.18)', w: la === 0 ? 0.9 : 0.35 });
    }
    for (let lo = -180; lo < 180; lo += 15) {
      const p = []; for (let la = -80; la <= 80; la += 4) p.push([la, lo]);
      paths.push({ pts: p, color: 'rgba(238,246,248,0.14)', w: 0.3 });
    }
    labels.push({ kind: 'label', lat: 1.2, lng: 20, text: '赤道', size: 0.6, color: 'rgba(232,194,122,0.9)' });
  }
  world.pathsData(paths);
  if (globeReady) world.htmlElementsData(labels);
}

/* ── 光源レンズ ── */
function drawLenses() {
  const box = $('lenses');
  box.innerHTML = `<button class="lens lens-all ${S.lens ? '' : 'on'}" data-l="">全体</button>` +
    LENSES.map(l => `<button class="lens ${S.lens === l.id ? 'on' : (S.lens ? 'dim' : '')}" style="--lc:${l.color}" data-l="${l.id}">${esc(l.name)}<span style="font-family:var(--mono);font-size:9px;color:var(--dim)">${EVENTS.filter(e => e.lenses.includes(l.id)).length}</span></button>`).join('');
  box.querySelectorAll('.lens').forEach(b => b.onclick = () => { S.lens = b.dataset.l && S.lens !== b.dataset.l ? b.dataset.l : null; refresh(); });
  if (!S.lens) { $('lensNote').textContent = 'いまは全体を正面から照らしています。レンズを押すと、その構造の出来事だけが光ります。'; return; }
  const n = EVENTS.filter(e => e.lenses.includes(S.lens));
  const solo = n.filter(e => e.lenses.length === 1).length;
  $('lensNote').innerHTML = `「${esc(LENS[S.lens].name)}」から照らしています（${n.length}件）。このレンズでしか光らない出来事：${solo}件（${Math.round(solo / n.length * 100)}%）。もう一度押すと全体へ。`;
}

/* ── 系統パネル ── */
function shortName(n) {
  return ({ urartu: 'T. urartu', b_donor: 'B供与種？', wild_emmer: '野生エンマー', cult_emmer: '栽培エンマー', durum: 'デュラム', tauschii: 'タルホコムギ',
    bread_wheat: 'パン小麦', wild_einkorn: '野生一粒', cult_einkorn: '栽培一粒', spelt: 'スペルト' })[n.id] || n.name;
}
const LAYOUT = { // x, y（ploidy の段：2x 下・4x 中・6x 上）。箱の幅 56
  bread_wheat: [100, 22], spelt: [190, 22],
  cult_emmer: [72, 82], wild_emmer: [72, 128], durum: [150, 82],
  urartu: [44, 184], b_donor: [108, 184], tauschii: [164, 128],
  wild_einkorn: [232, 184], cult_einkorn: [232, 128],
};
const EDGES = [['urartu', 'wild_emmer'], ['b_donor', 'wild_emmer'], ['wild_emmer', 'cult_emmer'], ['cult_emmer', 'durum'],
  ['cult_emmer', 'bread_wheat'], ['tauschii', 'bread_wheat'], ['bread_wheat', 'spelt'], ['wild_einkorn', 'cult_einkorn']];
const TRACE = [['bread_wheat'], ['cult_emmer', 'tauschii'], ['wild_emmer'], ['urartu', 'b_donor']];
function traceIds() { return S.trace < 0 ? [] : TRACE[S.trace]; }
function drawLineage() {
  const svg = $('lineageSvg'), W = 56, H = 28, tr = traceIds();
  let h = '';
  [['6x', 22], ['4x', 105], ['2x', 184]].forEach(([t, y]) => { h += `<text x="0" y="${y + 3}" style="font-size:8px;fill:rgba(238,243,248,.35);font-family:var(--mono)">${t}</text>`; });
  h += `<line x1="200" y1="101" x2="266" y2="101" stroke="rgba(238,243,248,.12)"/><text x="204" y="96" style="font-size:7.5px;fill:rgba(238,243,248,.38)">別の枝</text>`;
  for (const [a, b] of EDGES) {
    const [x1, y1] = LAYOUT[a], [x2, y2] = LAYOUT[b];
    const on = tr.includes(a) || tr.includes(b);
    h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? '#e8c27a' : 'rgba(238,243,248,.28)'}" stroke-width="${on ? 1.6 : 1}" ${a === 'b_donor' ? 'stroke-dasharray="3 3"' : ''}/>`;
  }
  for (const n of NODES) {
    const [x, y] = LAYOUT[n.id] || [0, 0];
    const cls = ['lin-node', n.status === 'unknown' ? 'unknown' : '', S.node === n.id ? 'sel' : '', tr.includes(n.id) ? 'trace' : ''].join(' ');
    const fill = n.status === 'unknown' ? 'rgba(0,0,0,0)' : 'rgba(7,14,24,.85)';
    h += `<g class="${cls}" data-id="${n.id}" transform="translate(${x - W / 2},${y - H / 2})">
      <rect width="${W}" height="${H}" rx="4" fill="${fill}" stroke="${n.status === 'unknown' ? 'rgba(238,243,248,.55)' : 'rgba(143,209,122,.6)'}"/>

      <text class="g" x="${W / 2}" y="24" text-anchor="middle">${esc(n.status === 'unknown' ? '未発見' : n.genome.replace(' または A', ''))}</text></g>`;
  }

  svg.querySelectorAll('.lin-node').forEach(g => g.onclick = () => openNode(g.dataset.id));
}
function openNode(id, fly = true) {
  const n = NODES.find(x => x.id === id); if (!n) return;
  S.node = id; S.sel = null;
  const cr = CROSS.filter(c => c.child.includes(shortName(n)) || c.name.includes(n.name.split(' ')[0]));
  $('dcWhen').textContent = `${n.ploidy}倍体 ${n.genome}`;
  $('dcTitle').textContent = n.name;
  $('dcFig').innerHTML = figHtml(n.id);
  $('dcPlace').textContent = n.region ? `地域：${n.region}` : '';

    (n.status === 'unknown' ? `<div class="cross">この枠が空いているのは、まだ誰も見つけていないからです。研究では Ae. speltoides に近い系統とされますが、供与した種そのものは特定されていません。地球のどこにも置けません。</div>` : '') +
    (cr.length ? `<details class="research" open><summary>研究の段 ▾</summary><div class="rs">${cr.map(c => `<h4>交雑・分岐</h4><p>${esc(c.parents)} → ${esc(c.child)}<br>${esc(c.label)}（${esc(c.region)}）</p><p>${esc(c.note_ja)}</p>${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}`).join('')}<h4>出典</h4><ul><li><a href="${esc(n.source.url)}" target="_blank" rel="noopener">${esc(n.source.title)}</a>（${esc(KIND_JA[n.source.kind] || n.source.kind)}）</li></ul></div></details>`
      : `<details class="research"><summary>研究の段 ▾</summary><div class="rs"><h4>出典</h4><ul><li><a href="${esc(n.source.url)}" target="_blank" rel="noopener">${esc(n.source.title)}</a></li></ul></div></details>`);
  const act = $('dcAct');
  act.hidden = n.lat == null;
  act.textContent = '自生域・推定域を見る';
  act.onclick = () => { S.wild = true; $('wildBtn').setAttribute('aria-pressed', 'true'); drawGlobe(); world.pointOfView({ lat: n.lat, lng: n.lng, altitude: 1.0 }, 900); };
  $('detailCard').hidden = false;
  if (fly && n.lat != null && S.wild) world.pointOfView({ lat: n.lat, lng: n.lng, altitude: 1.0 }, 900);
  drawLineage(); drawGlobe();
}
$('traceBtn').onclick = () => {
  S.trace = S.trace + 1 >= TRACE.length ? -1 : S.trace + 1;
  const ids = traceIds();
  S.wild = S.trace >= 0; $('wildBtn').setAttribute('aria-pressed', String(S.wild));
  const msg = ['いまのパン小麦（六倍体 AABBDD）。カスピ海の南のあたりで生まれたと推定されています。',
    '一段遡ると：育てていた四倍体の小麦と、野の草タルホコムギ（DD）。',
    'もう一段：野生エンマー（AABB）。数十万年前、二つの野の草が交わって生まれました。',
    'いちばん奥：T. urartu（A）と、もう一つの親（B）。Bの親はまだ見つかっていません。'];
  $('traceHint').textContent = S.trace < 0 ? 'いまのパン小麦から、野の草へ一段ずつ遡ります。' : msg[S.trace];
  $('traceBtn').textContent = S.trace < 0 ? '遡る ▸' : (S.trace === TRACE.length - 1 ? 'はじめに戻る ↺' : 'さらに遡る ▸');
  if (ids.length) {
    openNode(ids[0], false);
    const ps = ids.map(i => NODES.find(n => n.id === i)).filter(n => n && n.lat != null);
    if (ps.length) world.pointOfView({ lat: ps.reduce((a, n) => a + n.lat, 0) / ps.length, lng: ps.reduce((a, n) => a + n.lng, 0) / ps.length, altitude: 1.4 }, 1100);
  } else { S.node = null; $('detailCard').hidden = true; drawLineage(); drawGlobe(); }
};

/* ── 画像 ── */
function figHtml(target) {
  const im = IMAGES.filter(i => i.target === target);
  if (!im.length) return '';
  return [...im].sort((a, b) => a.generated - b.generated).map(one).join(''); // 実物を先に、想像図はあとに
}
function one(i) {
  if (i.generated) return `<figure class="dc-fig gen"><img src="${esc(i.file)}" alt="${esc(i.caption_ja)}（想像図）" loading="lazy"><span class="gen-mark">想像図</span>
    <figcaption>想像図（生成画像）：${esc(i.caption_ja)}<br>基づいた資料：${esc(i.basis)}<br>制作：${esc(i.made_by)}（${esc(i.made_on)}）。実物の写真や当時の資料ではありません。</figcaption></figure>`;
  return `<figure class="dc-fig"><img src="${esc(i.file)}" alt="${esc(i.caption_ja)}" loading="lazy">
    <figcaption>${esc(i.caption_ja)}<br>写真：${esc(i.artist)}／${esc(i.license)}　<a href="${esc(i.page)}" target="_blank" rel="noopener">元のページ ↗</a></figcaption></figure>`;
}

/* ── 出来事のカード ── */
function select(id) {
  const e = EVENTS.find(x => x.id === id); if (!e) return;
  S.sel = id; S.node = null;
  S.year = e.when.from; // 選んだ出来事の年へカーソルを動かす（地球と一覧もその時点まで展開）
  $('dcWhen').innerHTML = `${esc(whenText(e))}<span class="conf ${e.confidence}">${CONF_JA[e.confidence]}</span><span style="margin-left:8px;color:var(--dim);font-family:var(--sans);font-size:10px">${CLOCK_JA[e.clock] || ''}</span>`;
  $('dcTitle').textContent = e.title_ja;
  $('dcFig').innerHTML = figHtml(e.id);
  $('dcPlace').textContent = e.place.name_ja + (e.place.precision === 'region' ? '（地域の代表点）' : '');
  const L = e.links;
  $('dcBody').innerHTML = `<p class="kitchen">${esc(e.kitchen_ja)}</p>` +
    (L && L.cross_ja ? `<div class="cross">${esc(L.cross_ja)}${L.focus && L.focus.length ? '<br>' + L.focus.map(f => `<a href="../${f}/" target="_blank" rel="noopener">${f === 'manjiro' ? '万次郎 Focus' : '北斎 Focus'} ↗</a>`).join('　') : ''}</div>` : '') +
    `<div>${e.lenses.map(l => `<span class="chip" style="--lc:${LENS[l]?.color}">${esc(LENS[l]?.name || l)}</span>`).join('')}</div>` +
    `<details class="research"><summary>研究の段 ▾　だれが、どんな証拠で、どこまで言えているか</summary><div class="rs">
      <h4>学問</h4><div>${e.field.map(f => `<span class="fld">${esc(FIELDS[f] || f)}</span>`).join('')}</div>
      <h4>確かめられたこと</h4><p>${esc(e.research.fact_ja)}</p>
      <h4>わかっていないこと</h4><p>${esc(e.research.unknown_ja)}</p>
      <h4>知られた年</h4><p>${e.known.year ? esc(e.known.year) + '年　' : ''}${esc(e.known.label)}</p>
      ${L && L.person_qid ? `<h4>人物年鑑</h4><p>${esc(L.person_ja)}（Wikidata ${esc(L.person_qid)}）</p>` : ''}
      <h4>出典</h4><ul>${e.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>（${esc(KIND_JA[s.kind] || s.kind)}・確認 ${esc(s.checked)}）</li>`).join('')}</ul>
      ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
    </div></details>`;
  const act = $('dcAct');
  act.hidden = e.place.lat == null; act.textContent = '地点を見る';
  act.onclick = () => world.pointOfView({ lat: e.place.lat, lng: e.place.lng, altitude: e.place.precision === 'site' || e.place.precision === 'city' ? 0.9 : 1.5 }, 900);
  $('detailCard').hidden = false;
  refresh();
}
/* カードを動かす：帯をつかんで移動。置いた位置は次のカードでも保つ。帯を二度押しで元の位置へ */
(() => {
  const card = $('detailCard'), bar = $('dcBar'); let d = null;
  bar.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.dc-x') || innerWidth <= 760) return;
    const r = card.getBoundingClientRect(); d = { dx: ev.clientX - r.left, dy: ev.clientY - r.top }; card.style.width = r.width + 'px';
    bar.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  bar.addEventListener('pointermove', ev => {
    if (!d) return;
    const w = card.offsetWidth, x = Math.max(0, Math.min(innerWidth - w, ev.clientX - d.dx)), y = Math.max(0, Math.min(innerHeight - 60, ev.clientY - d.dy));
    card.classList.add('moved'); card.style.left = x + 'px'; card.style.top = y + 'px';
  });
  bar.addEventListener('pointerup', () => { d = null; });
  bar.addEventListener('dblclick', ev => { if (ev.target.closest('.dc-x')) return; card.classList.remove('moved'); card.style.left = ''; card.style.top = ''; card.style.width = ''; });
})();
$('dcClose').onclick = () => { S.sel = null; S.node = null; $('detailCard').hidden = true; refresh(); };

/* ── 右パネル ── */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t))); drawRight(); });
function drawRight() {
  const b = $('rpBody');
  if (S.tab === 'events') {
    const groups = CHAPTERS.filter(c => S.chapter === null || c.id === S.chapter);
    b.innerHTML = groups.map(c => {
      const items = EVENTS.filter(e => e.chapter === c.id).sort((a, z) => a.when.from - z.when.from);
      if (!items.length) return '';
      return `<div class="chap-head"><div class="n">${c.id ? `第${c.id}章　` : ''}${esc(c.name)}</div><div class="s">${esc(c.sub)}</div></div>` +
        items.map(e => `<div class="item ${S.sel === e.id ? 'sel' : ''} ${S.lens && !e.lenses.includes(S.lens) ? 'shade' : ''} ${timeState(e) === 'future' ? 'future' : ''} ${timeState(e) === 'now' ? 'now' : ''}" data-id="${e.id}">
          <div class="y">${esc(whenText(e))}<span class="conf ${e.confidence}">${CONF_JA[e.confidence]}</span></div><div class="t">${esc(e.title_ja)}</div></div>`).join('');
    }).join('') || '<div class="empty">この章の出来事はまだありません。</div>';
    b.querySelectorAll('.item').forEach(x => x.onclick = () => { stopPlay(); select(x.dataset.id); });
    const s = b.querySelector('.item.sel') || [...b.querySelectorAll('.item.now')].pop(); if (s) s.scrollIntoView({ block: 'nearest' });
  } else if (S.tab === 'leavens') {
    b.innerHTML = `<div class="empty">パンは何で膨らむのか。パン種と、そこで働く小さな生き物。</div>` + LEAVENS.map(v => `<div class="lv"><span class="nm">${esc(v.name_ja)}</span><span class="lvl">${esc(v.name_level)}</span>
      <p>${esc(v.what_ja)}</p><p style="color:var(--sub)">${esc(v.history_ja)}</p>${v.organisms ? `<div class="org">はたらく生き物：${esc(v.organisms)}</div>` : ''}
      <div class="org"><a href="${esc(v.source.url)}" target="_blank" rel="noopener">${esc(v.source.title)}</a></div></div>`).join('');
  } else if (S.tab === 'narr') {
    b.innerHTML = `<div class="empty">よく知られた話の「帰属の履歴」。年は、言われたとされる年ではなく、結びつけられた年で書きます。</div>` + ATTR.map(a => `<div class="lv">
      <span class="nm">${esc(a.claim)}</span><span class="conf ${a.confidence}">${CONF_JA[a.confidence] || a.confidence}</span>
      <p>結びつけられた相手：${esc(a.attributed_to)}</p>
      <p><b>いちばん古い文：</b>${esc(a.earliest.year)}　${esc(a.earliest.text)}</p>
      <p><b>結びつけた最初：</b>${esc(a.first_link.year)}　${esc(a.first_link.text)}</p>
      <p style="color:var(--sub)">${esc(a.note_ja)}</p>
      <div class="org"><a href="${esc(a.source.url)}" target="_blank" rel="noopener">${esc(a.source.title)}</a>（${esc(KIND_JA[a.source.kind] || a.source.kind)}）</div></div>`).join('');
  } else {
    b.innerHTML = CHECKS.map(c => `<div class="chap-head"><div class="s" style="font-size:11.5px;color:var(--ink);line-height:1.6">${esc(c.title_ja)}</div></div>` +
      c.items.map(i => `<div class="chk"><div class="q">「${esc(i.claim)}」<span class="conf ${i.verdict}">${CONF_JA[i.verdict]}</span></div><p>${esc(i.body)}</p>
        <div class="refs">${i.refs.map(r => { const e = EVENTS.find(x => x.id === r); return e ? `<span class="ref" data-id="${r}">${esc(e.title_ja)} ▸</span>` : ''; }).join('')}</div></div>`).join('') +
      `<div class="empty">出典：${c.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--cyan-soft)">${esc(s.title)}</a>`).join('、')}</div>`).join('');
    b.querySelectorAll('.ref').forEach(x => x.onclick = () => select(x.dataset.id));
  }
}

/* ── 年代バー：章ごとに縮尺が違う帯を並べ、全体を一本のスライダーとしてなぞれる ──
   原則：年カーソル（S.year）≠ 表示幅（S.chapter＝広げた章）≠ カメラ（再生と「地点を見る」の時だけ動く） */
function chapterAt(y) { const c = CHAPTERS.find(c => c.from <= y && y < c.to); return c ? c.id : (y < CHAPTERS[0].from ? CHAPTERS[0].id : CHAPTERS[CHAPTERS.length - 1].id); }
let TL = { segs: [], sw: 0, gap: 3 };
function xOfYear(y) {
  const i = TL.segs.findIndex(c => c.from <= y && y < c.to);
  if (i < 0) return y < TL.segs[0].from ? 0 : TL.segs.length * (TL.sw + TL.gap) - TL.gap;
  const c = TL.segs[i]; return i * (TL.sw + TL.gap) + (y - c.from) / (c.to - c.from) * TL.sw;
}
function yearAtX(x) {
  const i = Math.max(0, Math.min(TL.segs.length - 1, Math.floor(x / (TL.sw + TL.gap))));
  const c = TL.segs[i], f = Math.max(0, Math.min(1, (x - i * (TL.sw + TL.gap)) / TL.sw));
  return Math.round(c.from + f * (c.to - c.from - 1));
}
function yearText(y) {
  if (y < -3000) { const bp = 1950 - y; return bp >= 100000 ? `約${(bp / 10000).toFixed(0)}万年前` : `約${(Math.round(bp / 100) * 100).toLocaleString()}年前`; }
  return y < 0 ? `紀元前${Math.abs(y).toLocaleString()}年` : `${y}年`;
}
function drawTimeline() {
  const svg = $('tl'), W = svg.clientWidth || 1000, H = 118, gap = 3;
  const segs = S.chapter === null ? CHAPTERS : CHAPTERS.filter(c => c.id === S.chapter);
  const sw = (W - gap * (segs.length - 1)) / segs.length;
  TL = { segs, sw, gap };
  const lanes = { grass: 50, field: 72, bread: 94 };
  let h = '';
  segs.forEach((c, i) => {
    const x0 = i * (sw + gap), span = c.to - c.from;
    const X = y => x0 + Math.max(0, Math.min(1, (y - c.from) / span)) * sw;
    h += `<g class="seg ${chapterAt(S.year) === c.id ? 'cur' : ''}" data-c="${c.id}"><rect class="bg" x="${x0}" y="0" width="${sw}" height="${H}" rx="3"/>
      <text class="sname" data-c="${c.id}" x="${x0 + 6}" y="14">${c.id ? c.id + ' ' : ''}${esc(c.name)}${S.chapter === c.id ? '　◂ 全体へ' : ''}</text>
      <text class="sscale" x="${x0 + 6}" y="27">1目盛り＝${esc(c.tickLabel)}</text>`;
    const first = Math.ceil(c.from / c.tick) * c.tick;
    const n = Math.floor((c.to - first) / c.tick);
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(sw / 46))));
    for (let k = 0; k <= n; k++) {
      const y = first + k * c.tick, x = X(y);
      h += `<line class="tick" x1="${x}" x2="${x}" y1="36" y2="${k % every ? 39 : 42}"/>`;
      if (k % every === 0 && sw > 60) h += `<text class="tlab" x="${x}" y="${H - 3}" text-anchor="middle">${yr(y)}</text>`;
    }
    h += '</g>';
    if (i === 0 && sw > 160) Object.entries(lanes).forEach(([k, y]) => { h += `<text class="lane" x="${x0 + sw - 4}" y="${y - 6}" text-anchor="end">${CLOCK_JA[k]}</text>`; });
    for (const e of EVENTS.filter(e => e.chapter === c.id)) {
      const a = X(e.when.from), b = X(e.when.to), y = lanes[e.clock] || 94, on = lensOn(e), sel = S.sel === e.id;
      const ts = timeState(e);
      const col = on ? lensColor(e) : 'rgba(238,246,248,0.15)';
      h += `<g class="${ts === 'future' ? 'future' : (ts === 'past' ? 'past' : '')}">`;
      if (b - a > 3) h += `<rect x="${a}" y="${y - 2}" width="${b - a}" height="4" rx="2" fill="${col}" opacity="${e.confidence === 'range' ? 0.35 : 0.55}"/>`;
      const cx = (a + b) / 2, r = sel ? 6 : 4.2;
      const st = e.confidence === 'confirmed' ? `fill="${col}" stroke="${sel ? '#fff' : 'none'}"` :
        `fill="rgba(5,12,22,.9)" stroke="${sel ? '#fff' : col}" stroke-width="1.6" ${e.confidence === 'narrative' ? 'stroke-dasharray="2 2"' : ''}`;
      const shape = e.clock === 'grass' ? `<path d="M${cx} ${y - r} L${cx + r} ${y + r * .8} L${cx - r} ${y + r * .8} Z" ${st}/>` :
        e.clock === 'field' ? `<rect x="${cx - r * .85}" y="${y - r * .85}" width="${r * 1.7}" height="${r * 1.7}" ${st}/>` : `<circle cx="${cx}" cy="${y}" r="${r}" ${st}/>`;
      h += `<g class="mk" data-id="${e.id}"><title>${esc(e.title_ja)}（${esc(whenText(e))}）</title>${shape}</g></g>`;
    }
  });
  // 年カーソル
  const cx = xOfYear(S.year);
  h += `<line class="cur-line" x1="${cx}" x2="${cx}" y1="30" y2="${H - 12}"/><path class="cur-head" d="M${cx - 5} 30 L${cx + 5} 30 L${cx} 37 Z"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = h;
  svg.querySelectorAll('.mk').forEach(m => m.onclick = ev => { ev.stopPropagation(); stopPlay(); select(m.dataset.id, true); });
  svg.querySelectorAll('.sname').forEach(t => t.onclick = ev => { ev.stopPropagation(); const c = +t.dataset.c; S.chapter = S.chapter === c ? null : c;
    if (S.chapter !== null && chapterAt(S.year) !== c) S.year = CHAPTERS.find(x => x.id === c).from; refresh(); });
  const cur = CHAPTERS.find(c => c.id === chapterAt(S.year));
  $('tlYear').textContent = yearText(S.year);
  $('tlChap').textContent = `${cur.id ? '第' + cur.id + '章　' : ''}${cur.name}　${cur.sub}`;
  $('tlScale').textContent = S.chapter === null ? `この章は 1目盛り＝${cur.tickLabel}（章ごとに縮尺が違います）` : `${yr(cur.from)}〜${yr(cur.to)} を広げています　1目盛り＝${cur.tickLabel}`;
}
/* なぞる：バーの上で押したまま左右に動かすと年が進み、地球と一覧が展開する */
(() => {
  const svg = $('tl'); let drag = false;
  const at = ev => { const r = svg.getBoundingClientRect(); return yearAtX((ev.clientX - r.left) * (svg.viewBox.baseVal.width / r.width)); };
  svg.addEventListener('pointerdown', ev => { if (ev.target.closest('.mk,.sname')) return; drag = true; svg.setPointerCapture(ev.pointerId); stopPlay(); setYear(at(ev)); });
  svg.addEventListener('pointermove', ev => { if (drag) setYear(at(ev)); });
  svg.addEventListener('pointerup', () => { drag = false; });
})();
let raf = 0;
function setYear(y) { S.year = y; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawTimeline(); drawGlobe(); drawRight(); }); }

/* 前・次・再生：出来事を年の順に一つずつ（再生中だけカメラがその地点へ寄る） */
const ORDER = [...EVENTS].sort((a, b) => a.when.from - b.when.from || a.when.to - b.when.to);
function stepTo(dir) {
  const i = ORDER.findIndex(e => e.id === S.sel);
  let j;
  if (i >= 0) j = i + dir;
  else j = dir > 0 ? ORDER.findIndex(e => e.when.from > S.year) : ORDER.map(e => e.when.from <= S.year).lastIndexOf(true);
  if (j < 0 || j >= ORDER.length) return false;
  select(ORDER[j].id, true);
  const e = ORDER[j];
  if (S.playing && e.place.lat != null) world.pointOfView({ lat: e.place.lat, lng: e.place.lng, altitude: 1.6 }, 1200);
  return true;
}
let playTimer = 0;
function stopPlay() { S.playing = false; clearTimeout(playTimer); $('playBtn').textContent = '▶'; $('playBtn').setAttribute('aria-pressed', 'false'); }
function playNext() { if (!S.playing) return; if (!stepTo(1)) { stopPlay(); return; } playTimer = setTimeout(playNext, 4200); }
$('playBtn').onclick = () => { if (S.playing) { stopPlay(); return; } S.playing = true; $('playBtn').textContent = '❚❚'; $('playBtn').setAttribute('aria-pressed', 'true'); playNext(); };
$('prevE').onclick = () => { stopPlay(); stepTo(-1); };
$('nextE').onclick = () => { stopPlay(); stepTo(1); };

/* ── 層のボタン・出典 ── */
$('wildBtn').onclick = () => { S.wild = !S.wild; $('wildBtn').setAttribute('aria-pressed', String(S.wild)); drawGlobe(); if (S.wild) world.pointOfView({ lat: 36, lng: 44, altitude: 1.6 }, 900); };
$('gridBtn').onclick = () => { S.grid = !S.grid; $('gridBtn').setAttribute('aria-pressed', String(S.grid)); drawGlobe(); };
$('infoBtn').onclick = () => {
  S.sel = null; S.node = null;
  $('dcWhen').textContent = 'ABOUT';
  $('dcTitle').textContent = 'この Focus について';
  $('dcFig').innerHTML = '';
  $('dcPlace').textContent = '';
  const kinds = {}; EVENTS.forEach(e => e.sources.forEach(s => { kinds[s.kind] = (kinds[s.kind] || 0) + 1; }));
  $('dcBody').innerHTML = `<p class="kitchen">いま食べている一枚のパンから、一万年前の野の草へ遡り、また戻ってくる Focus です。主役は人物ではなく、植物と微生物と人の手と火です。</p>
    <div class="rs"><h4>確かさの3段</h4><p>確定＝証拠がはっきりしている（年代が幅でも）。幅＝学説が割れている・推定。語り＝伝説・俗説・後から結びつけられた話。確かめられなかったことは載せていません。</p>
    <h4>パンとは</h4><p>この Focus では「粉にした穀物を水と合わせ、熱を通したもの」をパンとします。膨らませるかどうかは性質の一つです。</p>
    <h4>出典の内訳</h4><p>${Object.entries(kinds).map(([k, n]) => `${esc(KIND_JA[k] || k)} ${n}`).join('、')}</p>
    <h4>画像について</h4><p>実物の写真・資料 ${IMAGES.filter(i => !i.generated).length} 点（Wikimedia Commons。各カードに作者・ライセンス・元のページ）。生成画像（想像図）は ${IMAGES.filter(i => i.generated).length} 点で、すべてに「◇ 想像図」の印を付け、何に基づいて描いたかを書いています。写真が残っていない場面や仕組みを示すためだけに使い、実物の代わりにはしません。</p>
    ${IMAGES.some(i => i.generated) ? `<div class="genlist">${IMAGES.filter(i => i.generated).map(i => `<figure data-t="${esc(i.target)}"><img src="${esc(i.file)}" alt=""><span class="gen-mark">想像図</span><figcaption>${esc(i.caption_ja)}</figcaption></figure>`).join('')}</div>` : ''}
    <h4>この版</h4><p>骨組み M1-0。年表 ${EVENTS.length} 件・系統 ${NODES.length} ノード。出典調査（2026-11-15）の下書きデータで、画像・世界のパン図鑑・英語版はまだありません。健康や体質の助言は扱いません。</p></div>`;
  $('dcAct').hidden = true;
  $('detailCard').hidden = false;
  refresh();
};

$('dcBody').addEventListener('click', ev => { const f = ev.target.closest('.genlist figure'); if (!f) return; const t = f.dataset.t;
  if (EVENTS.some(e => e.id === t)) select(t); else openNode(t, false); });
function refresh() { drawLenses(); drawLineage(); drawRight(); drawTimeline(); drawGlobe(); }
window.addEventListener('resize', drawTimeline);
refresh();
window.__bread = { S, EVENTS, NODES, select, openNode, world, drawGlobe, get ready() { return globeReady; } }; // 確認用
</script>
</body></html>
