<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Global History OS</title>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; overflow: hidden; 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
        }
        #globeViz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #ui-layer { position: absolute; bottom: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .info-panel { background: rgba(0,0,0,0.7); padding: 15px; border-left: 3px solid #ffaa00; pointer-events: auto; }
        #year-display { margin: 0; font-size: 3em; color: #fff; }
        #time-slider { width: 300px; cursor: pointer; }
        #event-log { font-size: 0.9em; color: #00d2ff; margin-top: 5px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "globe.gl": "https://unpkg.com/globe.gl"
      }
    }
    </script>
</head>
<body>
    <div id="globeViz"></div>
    <div id="ui-layer">
        <div class="info-panel">
            <h1 id="year-display">1830</h1>
            <input type="range" id="time-slider" min="1830" max="1870" value="1830">
            <div id="event-log">History OS Active</div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
