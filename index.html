<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>GLOBAL HISTORY MAP</title>

<style>

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
"Noto Sans JP",
sans-serif;

color:white;

}

/* =========================
GLOBE
========================= */

#globeViz{

position:fixed;

inset:0;

z-index:1;

}

/* =========================
TITLE
========================= */

.title{

position:absolute;

top:20px;

left:50%;

transform:translateX(-50%);

z-index:10;

text-align:center;

pointer-events:none;

}

.title h1{

margin:0;

font-size:64px;

font-weight:700;

letter-spacing:8px;

}

.title p{

margin-top:12px;

font-size:14px;

letter-spacing:5px;

color:#46dfff;

}

/* =========================
LEFT PANEL
========================= */

.events-panel{

position:absolute;

left:20px;

top:120px;

width:340px;

height:560px;

border:1px solid
rgba(255,255,255,0.08);

background:
rgba(0,0,0,0.35);

backdrop-filter:
blur(8px);

z-index:20;

padding:24px;

box-sizing:border-box;

overflow:auto;

}

.events-panel h2{

margin:0 0 30px 0;

font-size:18px;

letter-spacing:4px;

color:#46dfff;

}

/* =========================
EVENT ITEM
========================= */

.event-item{

position:relative;

padding-left:20px;

margin-bottom:36px;

}

.event-item::before{

content:'';

position:absolute;

left:0;
top:0;

width:2px;
height:60px;

background:#46dfff;

}

.event-year{

font-size:18px;

color:#46dfff;

margin-bottom:10px;

}

.event-title{

font-size:16px;

line-height:1.6;

}

/* =========================
TIMELINE
========================= */

.timeline{

position:absolute;

bottom:80px;

left:50%;

transform:translateX(-50%);

width:60%;

z-index:30;

}

#eraSlider{

width:100%;

}

#yearLabel{

text-align:center;

margin-top:22px;

font-size:56px;

color:#46dfff;

letter-spacing:6px;

}

/* =========================
LABELS
========================= */

#labelsLayer{

position:fixed;

inset:0;

pointer-events:none;

z-index:15;

}

.city-label{

position:absolute;

transform:
translate(-50%,-50%);

color:white;

font-size:18px;

font-weight:700;

text-shadow:
0 0 10px #000,
0 0 20px #000;

white-space:nowrap;

}

</style>

</head>

<body>

<!-- =========================
GLOBE
========================= -->

<div id="globeViz"></div>

<!-- =========================
LABELS
========================= -->

<div id="labelsLayer"></div>

<!-- =========================
TITLE
========================= -->

<div class="title">

<h1>
GLOBAL HISTORY MAP
</h1>

<p>
HISTORY OPERATING SYSTEM
</p>

</div>

<!-- =========================
LEFT PANEL
========================= -->

<div class="events-panel">

<h2>
WORLD EVENTS
</h2>

<div id="eventsList"></div>

</div>

<!-- =========================
TIMELINE
========================= -->

<div class="timeline">

<input
type="range"
id="eraSlider"
min="1800"
max="1900"
value="1841"
/>

<div id="yearLabel">
1841
</div>

</div>

<!-- =========================
MAIN
========================= -->

<script
type="module"
src="./main.js"
></script>

</body>

</html>
