<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GLOBAL HISTORY MAP</title>

  <style>
    html,body{
      margin:0;
      overflow:hidden;
      background:#000;
      color:white;
      font-family:"Noto Sans JP",sans-serif;
    }

    #globeViz{
      position:fixed;
      inset:0;
    }

    .title{
      position:absolute;
      top:18px;
      width:100%;
      text-align:center;
      z-index:10;
      pointer-events:none;
    }

    .title h1{
      margin:0;
      font-size:48px;
      letter-spacing:6px;
    }

    .title p{
      margin-top:8px;
      color:#46dfff;
      letter-spacing:4px;
      font-size:12px;
    }

    .timeline{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:60px;
      width:60%;
      z-index:20;
    }

    #yearLabel{
      text-align:center;
      margin-top:14px;
      color:#46dfff;
      font-size:32px;
      letter-spacing:4px;
    }

</html>
