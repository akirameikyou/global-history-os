<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>葛飾北斎版 プレビュー</title>
<style>
  :root{--bg:#efe7d6;--ink:#2a2622;--sub:#6a5f50;--land:#e2d8c2;--coast:#7f8ea3;
    --doc:#0f8f7e;--est:#c98a1a;--art:#8e5bd0;--fuji:#d64545;--cone:#2b4a7a;--line:#d8ccb4;}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.04em;font-weight:650}
  .ctl{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
  .ctl input[type=range]{width:180px}
  .val{color:var(--ink);font-weight:700;min-width:34px;text-align:right}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  button.t{background:#e5dbc6;color:var(--ink);border:1px solid #cbbd9f;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  button.t.off{opacity:.4}
  #wrap{position:relative;background:var(--bg)} svg{width:100%;height:auto;display:block}
  .jp{fill:var(--land);stroke:var(--coast);stroke-width:.5}
  .cone{fill:var(--cone);fill-opacity:.14;stroke:var(--cone);stroke-opacity:.65;stroke-width:.6}
  .axis{stroke:var(--cone);stroke-opacity:.55;stroke-width:.5;stroke-dasharray:2 2}
  .vp{stroke:#efe7d6;stroke-width:.8}
  .vp.doc{fill:var(--doc)} .vp.est{fill:var(--est)} .vp.art{fill:var(--art)}
  .fujidot{fill:var(--fuji)} .fujimark{fill:var(--fuji);stroke:#7a1f1f;stroke-width:.6}
  .lbl{fill:#3a3226;font-size:8px;font-weight:700;paint-order:stroke;stroke:#efe7d6;stroke-width:2.4px}
  #info{position:absolute;left:12px;bottom:12px;background:rgba(247,240,226,.96);border:1px solid #cbbd9f;
    border-radius:10px;padding:10px 12px;font-size:12.5px;max-width:420px;min-height:18px;color:#2a2622;line-height:1.6}
  #info a.lk{display:inline-block;margin-right:8px;font-size:11.5px;color:#2b4a7a;border:1px solid #b9c4d4;
    border-radius:6px;padding:2px 8px;text-decoration:none;background:#eef2f8}
  #info a.lk:hover{background:#e0e8f4}
  footer{padding:8px 16px;color:#8a7d68;font-size:11px;border-top:1px solid var(--line)}
</style></head><body>
<header>
  <h1>葛飾北斎版 · 視点＋富士コーン（プレビュー）</h1>
  <div class="ctl">表示 <select id="pick"><option value="">全図</option></select></div>
  <div class="ctl" id="oneCtl" style="display:none">この図の半角 <input id="one" type="range" min="1" max="10" step="0.5" value="3"><span class="val" id="onev">3°</span></div>
  <div class="ctl">全図の半角 <input id="ang" type="range" min="1" max="12" step="0.5" value="3"><span class="val" id="angv">3°</span></div>
  <button class="t" id="tLbl">番号</button>
  <button class="t" id="tCone">コーン</button>
  <button class="t" id="tExp">角度を書き出し</button>
  <div class="legend">
    <span><b style="background:#43c9b0"></b>documented</span>
    <span><b style="background:#e0b64a"></b>estimated</span>
    <span><b style="background:#c77dff"></b>artistic</span>
    <span><b style="background:#ff5c6c"></b>富士</span>
  </div>
</header>

function X(lng){return PROJ.pad+(lng-PROJ.lngmin)*PROJ.scale*PROJ.cosMid;}
function Y(lat){return PROJ.pad+(PROJ.latmax-lat)*PROJ.scale;}
function dest(lat,lng,brg,distKm){
  const R=6371,br=brg*Math.PI/180,dr=distKm/R,la=lat*Math.PI/180,lo=lng*Math.PI/180;
  const la2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(br));
  const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(la),Math.cos(dr)-Math.sin(la)*Math.sin(la2));
  return {lat:la2*180/Math.PI,lng:lo2*180/Math.PI};
}

      const Rr=dest(v.lat,v.lng,(v.brg+h)%360,v.dist);
      const tri=`${vx},${vy} ${X(L.lng)},${Y(L.lat)} ${X(Rr.lng)},${Y(Rr.lat)}`;
      gC.appendChild(el('polygon',{points:tri,class:'cone'}));
      gA.appendChild(el('line',{x1:vx,y1:vy,x2:fx,y2:fy,class:'axis'}));
    }
    const cls = v.fuji?'fujidot':(v.conf==='documented'?'vp doc':v.conf==='estimated'?'vp est':'vp art');
    const dot=el('circle',{cx:vx,cy:vy,r:v.fuji?2.8:(isSel?4.8:3.4),class:v.fuji?'fujidot':cls});
    if(v.refined&&!v.fuji){dot.setAttribute('stroke','#0f8f7e');dot.setAttribute('stroke-width','1.6');}
    if(faded) dot.setAttribute('opacity','0.25');
    dot.style.cursor='pointer';
    dot.addEventListener('mouseenter',()=>showInfo(v));
    dot.addEventListener('click',()=>{if(!v.fuji){selId=''+v.no;syncSel();}});
    gV.appendChild(dot);
    if((showLbl||isSel) && !faded){const t=el('text',{x:vx+4,y:vy-4,class:'lbl'});t.textContent=v.no;gL.appendChild(t);}
  });
}
const pick=document.getElementById('pick'),oneCtl=document.getElementById('oneCtl'),
      one=document.getElementById('one'),onev=document.getElementById('onev');
VIEWS.filter(v=>!v.fuji).forEach(v=>{const o=document.createElement('option');o.value=''+v.no;o.textContent=`#${v.no} ${v.ja}`;pick.appendChild(o);});
function syncSel(){
  pick.value=selId;
  if(selId===""){oneCtl.style.display='none';info.textContent='点をクリック（または「表示」で選択）すると、その1図だけコーン表示＋専用スライダーで角度を決められます。';}
  else{const v=VIEWS.find(x=>(''+x.no)===selId);oneCtl.style.display='';one.value=angOf(v);onev.textContent=angOf(v)+'°';showInfo(v);}
  draw();
}
pick.addEventListener('change',()=>{selId=pick.value;syncSel();});
one.addEventListener('input',()=>{if(selId!==""){overrides[+selId]=+one.value;onev.textContent=one.value+'°';const v=VIEWS.find(x=>(''+x.no)===selId);showInfo(v);draw();}});
document.getElementById('ang').addEventListener('input',e=>{half=+e.target.value;document.getElementById('angv').textContent=half+'°';if(selId==="")draw();else syncSel();});
document.getElementById('tLbl').addEventListener('click',e=>{showLbl=!showLbl;e.target.classList.toggle('off',!showLbl);draw();});
document.getElementById('tCone').addEventListener('click',e=>{showCone=!showCone;e.target.classList.toggle('off',!showCone);draw();});
document.getElementById('tExp').addEventListener('click',()=>{const k=Object.keys(overrides);if(!k.length){info.textContent='まだ個別角度の変更がありません。図を選んで「この図の半角」を動かすと記録されます。';return;}const j=JSON.stringify(overrides);info.innerHTML='<b>個別半角(度) JSON</b> — クリップボードにコピー<br>'+j;try{navigator.clipboard.writeText(j);}catch(e){}});
document.getElementById('tLbl').classList.add('off');
draw();
</script>
</body></html>
