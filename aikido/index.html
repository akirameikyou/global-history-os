<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIKIDO FOCUS — History OS</title>
<style>
:root{
  --accent:#a8d694;
  --bg:#07110b;
  --panel:rgba(7,17,11,0.46);
  --rule:rgba(255,255,255,0.08);
  --text:#eef6f0;
  --dim:rgba(238,246,240,0.45);
}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP",system-ui,sans-serif;
}
#globeViz{position:fixed;inset:0;z-index:1;}

.title{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  z-index:10;text-align:center;pointer-events:none;
}
.title h1{margin:0;font-size:24px;font-weight:700;letter-spacing:9px;}
.title p{margin-top:8px;font-size:11px;letter-spacing:5px;color:var(--accent);}

.panel{
  position:absolute;z-index:20;box-sizing:border-box;
  border:1px solid var(--rule);background:var(--panel);
  backdrop-filter:blur(9px);overflow:auto;
}
.panel::-webkit-scrollbar{width:6px;}
.panel::-webkit-scrollbar-thumb{background:rgba(168,214,148,0.22);}
.panel h2{margin:0 0 20px 0;font-size:13px;font-weight:700;letter-spacing:5px;color:var(--accent);}

/* LEFT: WORLD EVENTS */
.left-panel{left:22px;top:110px;width:260px;height:calc(100% - 240px);padding:22px;}
.we-item{padding:12px 12px;margin-bottom:6px;cursor:pointer;border-left:2px solid transparent;transition:.2s;}
.we-item:hover{background:rgba(168,214,148,0.06);}
.we-item.active{border-left-color:var(--accent);background:rgba(168,214,148,0.08);}
.we-item.dim{opacity:0.32;}
.we-year{font-size:14px;color:var(--accent);letter-spacing:1px;}
.we-title{font-size:14px;margin-top:4px;}
.we-desc{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6;}

/* RIGHT: FOCUS PANEL */
.focus-panel{right:22px;top:110px;width:330px;height:calc(100% - 240px);padding:24px;}
.focus-kicker{font-size:10px;letter-spacing:5px;color:var(--accent);}

.focus-portrait-wrap{
  width:112px;height:112px;border-radius:999px;overflow:hidden;
  margin-top:16px;border:1px solid rgba(168,214,148,0.35);
  background:rgba(255,255,255,0.05);
}
.focus-portrait{
  width:100%;height:100%;object-fit:cover;
  object-position:50% 20%; /* 顔（目・鼻）が円の中心に来るよう調整 */
}

.focus-title{font-size:21px;font-weight:700;margin-top:16px;line-height:1.4;letter-spacing:0.06em;}
.focus-sub{font-size:12px;color:var(--accent);margin-top:6px;letter-spacing:2px;}
.focus-body{margin-top:18px;font-size:12.5px;line-height:1.95;color:rgba(238,246,240,0.82);}

.focus-chrono-title{margin-top:24px;padding-top:16px;border-top:1px solid var(--rule);font-size:10px;letter-spacing:3px;color:var(--dim);}
.focus-chrono{margin-top:12px;}
.chrono-item{margin-bottom:14px;cursor:pointer;}
.chrono-item.inert{cursor:default;opacity:0.7;}
.chrono-year{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.chrono-text{font-size:12.5px;line-height:1.6;color:rgba(238,246,240,0.85);margin-top:3px;}

.focus-back{margin-top:22px;font-size:11px;color:var(--accent);cursor:pointer;letter-spacing:1px;}
.focus-back:hover{text-decoration:underline;}

/* BOTTOM: TIMELINE */
.timeline{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:52%;max-width:720px;z-index:30;}
.timeline-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
#yearLabel{font-size:44px;color:var(--accent);letter-spacing:4px;line-height:1;}
.range-note{font-size:11px;color:var(--dim);letter-spacing:1px;}

.slider-wrap{position:relative;}
#yearMarkers{position:absolute;left:0;right:0;top:-4px;height:0;pointer-events:none;}
.marker{position:absolute;top:0;width:1px;height:12px;background:rgba(255,255,255,0.22);transform:translateX(-50%);pointer-events:auto;cursor:pointer;}
.marker.reached{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.marker:hover{height:16px;}
#eraSlider{width:100%;margin-top:14px;accent-color:var(--accent);}
</style>
</head>
<body>

<div id="globeViz"></div>

<div class="title">
  <h1>AIKIDO FOCUS</h1>
  <p>HISTORY OS / FOCUS PERSON — MORIHEI UESHIBA</p>
</div>

<div class="panel left-panel">
  <h2>WORLD EVENTS</h2>
  <div id="worldEventList"></div>
</div>

<div class="panel focus-panel" id="focusPanel"></div>

<div class="timeline">
  <div class="timeline-head">
    <div id="yearLabel">1880</div>
    <div class="range-note">1880 — PRESENT</div>
  </div>
  <div class="slider-wrap">
    <div id="yearMarkers"></div>
    <input type="range" id="eraSlider" min="1880" max="2026" value="1880" />
  </div>
</div>

<script type="module" src="./aikidoMain.js"></script>
</body>
</html>
